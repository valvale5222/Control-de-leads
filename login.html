<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Control de Oportunidades</title>
<script>
  /* Si ya hay sesión guardada, no tiene sentido mostrar el login: se manda
     derecho al panel. Chequeo rápido por localStorage (sin esperar a que
     cargue supabase-js) para que sea instantáneo. */
  (function(){
    /* Mismo tema que el panel. La clave y los valores los escribe applyTheme()
       en index.html; acá solo se leen. Va antes de pintar para que no haya un
       destello oscuro al entrar con el tema claro puesto: la paleta clara ya
       existía en el CSS pero nunca se activaba, así que el login se veía
       oscuro aunque el panel estuviera en claro. */
    try{
      var tema = localStorage.getItem('panelOportunidadesTheme');
      if(tema === 'light' || tema === 'dark'){
        document.documentElement.setAttribute('data-theme', tema);
      }
    }catch(e){}
    try{
      var haySesion = Object.keys(localStorage).some(function(k){
        return k.indexOf('-auth-token') !== -1 && !!localStorage.getItem(k);
      });
      if(haySesion){ window.location.replace('index.html'); }
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#4A9FD1; --navy-deep:#3A82AE; --teal:#4AB39F; --teal-deep:#3B9684;
    --app-bg:#0E1520;
    --section-surface:rgba(35,42,51,.76);
    --border-soft:rgba(190,207,224,.10);
    --bg:var(--app-bg); --surface:#252E38; --line:var(--border-soft);
    --ink:#EAF0F6; --ink-soft:#A8B5C4; --ink-dim:#78879A;
    --danger:#D46A63; --danger-bg:rgba(212,106,99,0.10);
    --ok-bg:rgba(74,174,131,0.10);
    --radius-sm:8px; --radius-xl:24px;
    --shadow-lg:0 24px 60px rgba(2,6,16,.40);
    --ease:cubic-bezier(.2,.8,.2,1);
    --glass-border:rgba(203,218,235,.10); --glass-blur:blur(18px) saturate(112%);
    /* Ambientación del fondo (ver ADN_DISENO.md §8: grid tecnológico a .045,
       halos radiales de baja opacidad, y copos decorativos "grandes pero no
       invasivos"). Las opacidades de los copos van como tokens porque sobre
       fondo claro el verde menta necesita menos presencia para no ensuciar. */
    --grid-line:rgba(58,171,239,.045);
    --halo-teal:rgba(74,179,159,.20);
    --halo-navy:rgba(74,159,209,.20);
    --copo-1:.038; --copo-2:.05; --copo-3:.034; --copo-4:.044;
  }
  :root[data-theme="light"]{
    --navy:#477EA5; --navy-deep:#3D6D90; --teal:#318F82; --teal-deep:#297A6F;
    --app-bg:#EEF2F5;
    --section-surface:rgba(218,226,232,.78);
    --border-soft:rgba(37,55,76,.09);
    --surface:#E9EEF2; --line:var(--border-soft);
    --ink:#263548; --ink-soft:#657489; --ink-dim:#8B97A5;
    --danger:#C35E57; --danger-bg:rgba(195,94,87,0.08);
    --ok-bg:rgba(61,147,111,0.10);
    --shadow-lg:0 24px 60px rgba(6,12,32,.12);
    --glass-border:rgba(36,51,72,.09); --glass-blur:blur(18px) saturate(112%);
    --grid-line:rgba(41,122,111,.055);
    --halo-teal:rgba(49,143,130,.16);
    --halo-navy:rgba(71,126,165,.16);
    --copo-1:.05; --copo-2:.062; --copo-3:.044; --copo-4:.055;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:'Inter','Segoe UI',Arial,sans-serif;color:var(--ink);
    /* Los dos degradados radiales que estaban acá pasaron a .halo, para poder
       animarlos. Siguen siendo dos: el ADN pide no superar ese número. */
    background:var(--bg);
    transition:background-color .25s var(--ease),color .25s var(--ease);
  }

  /* ============================================================
     FONDO ANIMADO — tres capas, de atrás hacia adelante:
     grid tecnológico, dos halos ambientales y los copos del isotipo.
     Todo decorativo: aria-hidden y sin capturar el puntero.
     Se anima sólo `transform` y `opacity`, que la GPU resuelve sin
     recalcular layout; nada de animar blur ni degradados, que obligan a
     repintar en cada frame y en un login se notaría como tirones.
     ============================================================ */
  .bg-fx{
    position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;
    animation:fxEntrada 2s var(--ease) both;
  }
  @keyframes fxEntrada{from{opacity:0;}to{opacity:1;}}

  /* Grid de 32px (ADN §8.2). El desplazamiento es exactamente un mosaico, así
     que el ciclo cierra sin salto visible: parece un movimiento infinito. */
  .bg-grid{
    position:absolute;inset:-40px;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:32px 32px;
    animation:gridDeriva 60s linear infinite;
  }
  @keyframes gridDeriva{
    from{transform:translate3d(0,0,0);}
    to{transform:translate3d(32px,32px,0);}
  }

  /* Halos ambientales (ADN §8.3): 520px, radial, opacidad baja, blur suave.
     El blur es estático y sólo se mueve/escala el elemento, así el navegador
     reutiliza la capa ya desenfocada en vez de recalcularla. */
  .halo{
    position:absolute;width:520px;height:520px;border-radius:50%;
    filter:blur(20px);will-change:transform;
  }
  .halo-teal{
    top:-20%;left:-12%;
    background:radial-gradient(circle, var(--halo-teal), transparent 68%);
    animation:haloA 28s ease-in-out infinite;
  }
  .halo-navy{
    top:-10%;right:-16%;
    background:radial-gradient(circle, var(--halo-navy), transparent 68%);
    animation:haloB 36s ease-in-out infinite;
  }
  @keyframes haloA{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%    {transform:translate3d(46px,34px,0) scale(1.12);}
  }
  @keyframes haloB{
    0%,100%{transform:translate3d(0,0,0) scale(1.06);}
    50%    {transform:translate3d(-38px,42px,0) scale(1);}
  }

  /* COPOS — el isotipo como elemento decorativo.
     Dos elementos anidados a propósito: el contenedor flota y la imagen gira.
     Si ambas animaciones fueran sobre el mismo nodo, la segunda `transform`
     pisaría a la primera y sólo se vería una.
     El copo tiene simetría de seis, así que al girar lee como algo preciso y
     mecánico —de marca— y no como una animación juguetona. Las duraciones son
     largas y distintas entre sí para que los copos nunca queden sincronizados:
     el fondo no se siente como un bucle. */
  .copo{position:absolute;will-change:transform;}
  .copo img{display:block;width:100%;height:auto;will-change:transform;}

  /* El isotipo original mide 40x40 px, así que los copos grandes lo amplían
     varias veces y sin ayuda se verían con el borde escalonado. El desenfoque
     va graduado según cuánto amplía cada uno (el de 430px lo hace 10,7 veces;
     el de 68px, menos de dos) y es estático, no animado: el navegador
     desenfoca una sola vez y después sólo mueve la capa ya resuelta.
     Con una imagen más grande o un SVG, estos blur se pueden bajar a cero. */
  .copo-1 img{filter:blur(3px);}
  .copo-2 img{filter:blur(.7px);}
  .copo-3 img{filter:blur(.3px);}
  .copo-4 img{filter:blur(.5px);}

  /* Composición deliberada: un copo grande de ancla abajo a la derecha y tres
     acentos en las otras esquinas. Con un quinto copo la esquina del ancla
     quedaba con dos formas superpuestas y el fondo se leía cargado; cuatro
     alcanzan para dar profundidad sin competir con el formulario. */
  .copo-1{width:430px;bottom:-14%;right:-8%;opacity:var(--copo-1);animation:flota1 26s ease-in-out infinite;}
  .copo-2{width:168px;top:11%;left:7%;opacity:var(--copo-2);animation:flota2 19s ease-in-out infinite;}
  .copo-3{width:104px;bottom:16%;left:14%;opacity:var(--copo-3);animation:flota3 23s ease-in-out infinite;}
  .copo-4{width:132px;top:14%;right:11%;opacity:var(--copo-4);animation:flota4 31s ease-in-out infinite;}

  .copo-1 img{animation:giro 150s linear infinite;}
  .copo-2 img{animation:giro 74s linear infinite reverse;}
  .copo-3 img{animation:giro 96s linear infinite;}
  .copo-4 img{animation:giro 112s linear infinite reverse;}

  @keyframes giro{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes flota1{0%,100%{transform:translate3d(0,0,0);}50%{transform:translate3d(-18px,-24px,0);}}
  @keyframes flota2{0%,100%{transform:translate3d(0,0,0);}50%{transform:translate3d(14px,20px,0);}}
  @keyframes flota3{0%,100%{transform:translate3d(0,0,0);}50%{transform:translate3d(20px,-16px,0);}}
  @keyframes flota4{0%,100%{transform:translate3d(0,0,0);}50%{transform:translate3d(-16px,22px,0);}}

  /* En pantallas chicas la tarjeta ocupa casi todo el ancho: los copos del
     medio quedarían detrás del formulario, ensuciando la lectura. Se dejan
     sólo los de las esquinas y más chicos. */
  @media (max-width:560px){
    .copo-1{width:260px;bottom:-8%;right:-14%;}
    .copo-2{width:110px;}
    .copo-3{display:none;}
    .copo-4{width:88px;}
    .halo{width:380px;height:380px;}
  }

  /* Quien pidió menos movimiento en su sistema recibe la misma composición,
     quieta. No se esconde nada: sólo se congela. */
  @media (prefers-reduced-motion:reduce){
    .bg-fx,.bg-grid,.halo,.copo,.copo img,.login-card{animation:none !important;}
  }
  .login-card{
    position:relative;z-index:1;
    width:100%;max-width:380px;
    background:var(--section-surface);border:1px solid var(--glass-border);border-radius:var(--radius-xl);
    box-shadow:var(--shadow-lg);padding:34px 28px 28px;text-align:center;
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
    animation:tarjetaEntrada .8s var(--ease) both;
  }
  /* Filete de luz en el borde superior: un degradado de 1px que se apaga hacia
     los extremos. Es el mismo par teal→navy de los botones primarios, así que
     no introduce color nuevo — sólo hace que el canto de la tarjeta atrape la
     luz y separe la pieza del fondo. */
  .login-card::before{
    content:"";position:absolute;top:0;left:22px;right:22px;height:1px;border-radius:1px;
    background:linear-gradient(90deg,transparent,var(--teal),var(--navy),transparent);
    opacity:.55;
  }
  @keyframes tarjetaEntrada{
    from{opacity:0;transform:translate3d(0,16px,0) scale(.985);}
    to  {opacity:1;transform:none;}
  }
  .logo-card{display:flex;justify-content:center;margin-bottom:16px;}
  .logo-card img{height:44px;display:block;}
  .login-card h1{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em;}
  .login-subtitle{margin:6px 0 26px;font-size:12.5px;color:var(--ink-soft);}
  .login-field{display:block;text-align:left;margin-bottom:14px;}
  .login-field span{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase;}
  .login-field input{
    width:100%;height:40px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;outline:none;
    transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
  }
  .login-field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--ok-bg);}
  .login-error{color:var(--danger);background:var(--danger-bg);border-radius:var(--radius-sm);padding:9px 11px;font-size:12px;margin:0 0 14px;text-align:left;}
  .login-error[hidden]{display:none;}
  .login-submit{
    width:100%;height:42px;border:none;border-radius:var(--radius-sm);margin-top:4px;
    background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
    transition:filter .16s var(--ease),transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  .login-submit:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 18px rgba(4,8,20,.22);}
  .login-submit:disabled{opacity:.6;cursor:default;}
</style>
</head>

<script>
const SUPABASE_URL = 'https://tfzanbbdvzullwlauxia.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_q-RLhPZqhDtnPHhmkkXaHA_d7FRXHC6';
let db = null;

/* Supabase Auth identifica las cuentas por correo — no tiene login por
   usuario suelto (la alternativa sería por teléfono, que cuesta SMS). Así que
   el panel pide un usuario y le agrega este dominio por detrás: "hugo" entra
   como "hugo@friopacking.pe". El correo no necesita existir de verdad; es
   solo el identificador interno de la cuenta.
   Si alguien escribe un correo completo, se respeta tal cual, para que las
   cuentas viejas y una eventual migración a correos reales sigan entrando. */
const DOMINIO_USUARIOS = 'friopacking.pe';

function correoDesdeUsuario(entrada){
  const v = String(entrada || '').trim().toLowerCase();
  return v.includes('@') ? v : v + '@' + DOMINIO_USUARIOS;
}

function mostrarError(mensaje){
  const err = document.getElementById('login-error');
  err.textContent = mensaje;
  err.hidden = false;
}

async function handleLoginSubmit(ev){
  ev.preventDefault();
  if(!db){ mostrarError('Todavía se está cargando la librería de autenticación. Esperá un segundo y probá de nuevo.'); return; }
  const email = correoDesdeUsuario(document.getElementById('login-usuario').value);
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-submit');
  btn.disabled = true; btn.textContent = 'Ingresando…';
  const {error} = await db.auth.signInWithPassword({email, password});
  if(error){
    console.error('Error al iniciar sesión:', error);
    mostrarError(error.message === 'Invalid login credentials' ? 'Usuario o contraseña incorrectos.' : error.message);
    btn.disabled = false; btn.textContent = 'Ingresar';
    return;
  }
  window.location.replace('index.html');
}
