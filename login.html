<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Control de Oportunidades</title>
<script>
  /* Si ya hay sesión guardada, no tiene sentido mostrar el login: se manda
     derecho al panel. Chequeo rápido por localStorage (sin esperar a que
     cargue supabase-js) para que sea instantáneo. */
  (function(){
    /* Tema día/noche. Comparte la clave con el panel (la escribe applyTheme()
       en index.html), así que el tema elegido acá se respeta al entrar y
       viceversa. Por defecto, oscuro. Se aplica antes de pintar para que no
       haya un destello del tema equivocado. */
    try{
      var tema = localStorage.getItem('panelOportunidadesTheme');
      document.documentElement.setAttribute('data-theme', tema === 'light' ? 'light' : 'dark');
    }catch(e){
      document.documentElement.setAttribute('data-theme','dark');
    }
    try{
      var haySesion = Object.keys(localStorage).some(function(k){
        return k.indexOf('-auth-token') !== -1 && !!localStorage.getItem(k);
      });
      if(haySesion){ window.location.replace('index.html'); }
    }catch(e){}
  })();
</script>

<style>
  :root{
    --navy:#4A9FD1; --navy-deep:#3A82AE; --teal:#4AB39F; --teal-deep:#3B9684;
    --app-bg:#0E1520;
    --section-surface:rgba(35,42,51,.76);
    --border-soft:rgba(190,207,224,.10);
    --bg:var(--app-bg); --surface:#252E38; --line:var(--border-soft);
    --ink:#EAF0F6; --ink-soft:#A8B5C4; --ink-dim:#78879A;
    --danger:#D46A63; --danger-bg:rgba(212,106,99,0.10);
    --ok-bg:rgba(74,174,131,0.10);
    --radius-sm:8px; --radius-xl:24px; --radius-pill:999px;
    --surface-alt:#303B47;
    --shadow-sm:0 2px 8px rgba(2,6,16,.28);
    --shadow-lg:0 24px 60px rgba(2,6,16,.40);
    --ease:cubic-bezier(.2,.8,.2,1);
    --glass-border:rgba(203,218,235,.10); --glass-blur:blur(18px) saturate(112%);
    /* Halo de los isotipos del fondo. Es lo que los hace leer como puntos de
       luz —nodos de un sistema— en vez de stickers pegados. */
    --nodo-glow:rgba(74,179,159,.60);
    --nodo-op:.22;
  }
  :root[data-theme="light"]{
    --navy:#477EA5; --navy-deep:#3D6D90; --teal:#318F82; --teal-deep:#297A6F;
    --app-bg:#EEF2F5;
    --section-surface:rgba(218,226,232,.78);
    --border-soft:rgba(37,55,76,.09);
    --surface:#E9EEF2; --line:var(--border-soft);
    --ink:#263548; --ink-soft:#657489; --ink-dim:#8B97A5;
    --danger:#C35E57; --danger-bg:rgba(195,94,87,0.08);
    --ok-bg:rgba(61,147,111,0.10);
    --surface-alt:#DCE4E9;
    --shadow-sm:0 2px 8px rgba(6,12,32,.10);
    --shadow-lg:0 24px 60px rgba(6,12,32,.12);
    --glass-border:rgba(36,51,72,.09); --glass-blur:blur(18px) saturate(112%);
    /* Sobre fondo claro el halo verde ensucia, así que casi se apaga y los
       isotipos se apoyan en su propio color con algo más de opacidad. */
    --nodo-glow:rgba(41,122,111,.18);
    --nodo-op:.22;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:'Inter','Segoe UI',Arial,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 10% -5%, rgba(74,179,159,0.14), transparent 45%),
      radial-gradient(circle at 95% 8%, rgba(74,159,209,0.16), transparent 42%),
      var(--bg);
    transition:background-color .25s var(--ease),color .25s var(--ease);
  }
  .login-card{
    /* La capa de nodos va con position:fixed, que crea contexto de apilado y
       pintaría por encima de la tarjeta. Con esto la tarjeta queda adelante. */
    position:relative;z-index:1;
    width:100%;max-width:380px;
    background:var(--section-surface);border:1px solid var(--glass-border);border-radius:var(--radius-xl);
    box-shadow:var(--shadow-lg);padding:34px 28px 28px;text-align:center;
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  }
  .logo-card{display:flex;justify-content:center;margin-bottom:16px;}
  .logo-card img{height:44px;display:block;}
  /* El logotipo es blanco (pensado para fondo oscuro) y sobre la tarjeta clara
     quedaba casi ilegible. No se veía antes porque el tema claro existía en el
     CSS pero no había forma de activarlo; al agregar el interruptor quedó a la
     vista. El filtro lleva el texto a gris oscuro y el isotipo al teal profundo
     de la paleta clara, así que sigue siendo el logo de la marca.
     Si algún día hay una versión oscura del logotipo, reemplaza esto. */
  :root[data-theme="light"] .logo-card img{filter:brightness(.42) saturate(1.55);}
  .login-card h1{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em;}
  .login-subtitle{margin:6px 0 26px;font-size:12.5px;color:var(--ink-soft);}
  .login-field{display:block;text-align:left;margin-bottom:14px;}
  .login-field span{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase;}
  .login-field input{
    width:100%;height:40px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:13.5px;outline:none;
    transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
  }
  .login-field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--ok-bg);}
  .login-error{color:var(--danger);background:var(--danger-bg);border-radius:var(--radius-sm);padding:9px 11px;font-size:12px;margin:0 0 14px;text-align:left;}
  .login-error[hidden]{display:none;}
  .login-submit{
    width:100%;height:42px;border:none;border-radius:var(--radius-sm);margin-top:4px;
    background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
    transition:filter .16s var(--ease),transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  .login-submit:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 18px rgba(4,8,20,.22);}
  .login-submit:disabled{opacity:.6;cursor:default;}

  /* ============================================================
     ISOTIPOS DEL FONDO — seis nodos pequeños.
     El isotipo mide 40x40 px, así que se usan a 20–34 px: por debajo de su
     tamaño real, nunca ampliado. Así quedan nítidos, incluso en pantallas
     retina, y no hace falta desenfocarlos para tapar el escalonado.
     La lectura de "app técnica" no viene del tamaño sino de tres cosas
     juntas: el halo que los convierte en puntos de luz, el giro lento y
     constante (el copo tiene simetría de seis, así que girando se ve preciso
     y mecánico) y el pulso desfasado entre unos y otros, que hace que el
     conjunto parezca un sistema con actividad y no un adorno quieto.
     ============================================================ */
  .bg-nodos{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}

  /* Dos nodos anidados a propósito: el contenedor deriva y pulsa, la imagen
     gira. Si el giro fuera en el mismo elemento, su transform pisaría la de
     la deriva y sólo se vería una de las dos. Deriva y pulso sí conviven en
     el contenedor porque tocan propiedades distintas (transform y opacity). */
  .nodo{
    position:absolute;opacity:var(--nodo-op);
    animation:nodoDeriva var(--deriva) ease-in-out infinite,
              nodoPulso  var(--pulso)  ease-in-out infinite;
  }
  .nodo img{
    display:block;width:100%;height:auto;
    filter:drop-shadow(0 0 7px var(--nodo-glow));
    animation:nodoGiro var(--giro) linear infinite;
  }

  /* Posiciones repartidas por los bordes: la tarjeta ocupa el centro y los
     nodos no deben pasar por detrás del formulario. Duraciones todas
     distintas y sin múltiplos comunes, para que no se sincronicen nunca. */
  .nodo-1{width:30px;top:14%;left:12%; --deriva:23s; --pulso:7s;  --giro:64s;}
  .nodo-2{width:24px;top:27%;right:13%;--deriva:19s; --pulso:9s;  --giro:48s;}
  .nodo-3{width:34px;bottom:17%;left:19%;--deriva:27s;--pulso:11s;--giro:78s;}
  .nodo-4{width:26px;bottom:12%;right:17%;--deriva:21s;--pulso:8s;--giro:56s;}
  .nodo-5{width:20px;top:49%;left:5%;  --deriva:17s; --pulso:6s;  --giro:40s;}
  .nodo-6{width:28px;top:63%;right:7%; --deriva:25s; --pulso:10s; --giro:70s;}

  .nodo-2 img,.nodo-4 img,.nodo-6 img{animation-direction:reverse;}

  @keyframes nodoGiro{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  @keyframes nodoDeriva{
    0%,100%{transform:translate3d(0,0,0);}
    50%    {transform:translate3d(12px,-16px,0);}
  }
  /* El pulso arranca y termina en 1 (la opacidad base la fija --nodo-op) y
     baja a la mitad en el medio: respira, no titila. */
  @keyframes nodoPulso{
    0%,100%{opacity:var(--nodo-op);}
    50%    {opacity:calc(var(--nodo-op) * .45);}
  }

  /* En pantallas chicas la tarjeta ocupa casi todo el ancho: se dejan sólo
     los nodos de las esquinas para que no queden detrás del formulario. */
  @media (max-width:560px){
    .nodo-5,.nodo-6{display:none;}
    .nodo-1{left:7%;} .nodo-3{left:10%;}
  }

  /* Quien pidió menos movimiento ve los mismos nodos, quietos. */
  @media (prefers-reduced-motion:reduce){
    .nodo,.nodo img{animation:none !important;}
  }

  /* ============================================================
     SWITCH DÍA / NOCHE — mismo componente que el header del panel, para que
     no haya dos interruptores distintos en el mismo producto.
     ============================================================ */
  .theme-switch{
    position:relative;display:flex;background:var(--surface-alt);border:1px solid var(--line);
    border-radius:var(--radius-pill);padding:3px;gap:2px;width:96px;margin:0 auto 18px;
  }
  .theme-switch::before{
    content:"";position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);
    background:linear-gradient(135deg,var(--navy),#1B3FA8);border-radius:var(--radius-pill);
    transition:transform .22s var(--ease);box-shadow:var(--shadow-sm);
  }
  :root[data-theme="light"] .theme-switch::before{background:linear-gradient(135deg,var(--teal-deep),var(--teal));}
  .theme-switch:has([data-theme-btn="light"].active)::before{transform:translateX(100%);}
  .theme-switch button{
    position:relative;z-index:1;flex:1;background:transparent;border:none;color:var(--ink-dim);
    padding:6px 0;border-radius:var(--radius-pill);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:color .15s var(--ease);
  }
  .theme-switch button svg{width:15px;height:15px;}
  .theme-switch button.active{color:#fff;}
  :root[data-theme="light"] .theme-switch button.active{color:#06241d;}
</style>
</head>

  return v.includes('@') ? v : v + '@' + DOMINIO_USUARIOS;
}

/* Misma clave y mismos valores que applyTheme() en index.html, así el tema
   viaja entre el login y el panel. El estado inicial ya lo dejó puesto el
   script del <head>; acá sólo se marca el botón activo y se responde al clic. */
const THEME_KEY = 'panelOportunidadesTheme';

function applyTheme(tema){
  document.documentElement.setAttribute('data-theme', tema);
  try{ localStorage.setItem(THEME_KEY, tema); }catch(e){}
  document.querySelectorAll('[data-theme-btn]').forEach(function(b){
    b.classList.toggle('active', b.dataset.themeBtn === tema);
  });
}

function mostrarError(mensaje){
  const err = document.getElementById('login-error');
  err.textContent = mensaje;
  err.hidden = false;
}

async function handleLoginSubmit(ev){
  ev.preventDefault();
  if(!db){ mostrarError('Todavía se está cargando la librería de autenticación. Esperá un segundo y probá de nuevo.'); return; }
  const email = correoDesdeUsuario(document.getElementById('login-usuario').value);
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-submit');
  btn.disabled = true; btn.textContent = 'Ingresando…';
  const {error} = await db.auth.signInWithPassword({email, password});
  if(error){
    console.error('Error al iniciar sesión:', error);
    mostrarError(error.message === 'Invalid login credentials' ? 'Usuario o contraseña incorrectos.' : error.message);
    btn.disabled = false; btn.textContent = 'Ingresar';
    return;
  }
  window.location.replace('index.html');
}

document.getElementById('login-form').addEventListener('submit', handleLoginSubmit);

window.addEventListener('DOMContentLoaded', function(){
  /* El <head> ya dejó puesto el tema, pero los botones todavía no existían,
     así que acá se marca el activo. Va antes del chequeo de supabase-js: si
     el CDN no cargó, el interruptor tiene que seguir funcionando igual. */
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

  if(typeof supabase === 'undefined'){
    mostrarError('No se pudo conectar con el servidor. Revisa tu conexión a internet y recargá la página.');
    return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
});
</script>
</body>
</html>
