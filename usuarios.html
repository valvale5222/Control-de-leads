<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de usuarios — Control de Oportunidades</title>
<script>
  /* Guardia rápida: sin sesión guardada, ni vale la pena pintar esta vista.
     La restricción real por rol admin la hace RLS en Supabase (ver
     supabase/11_admin_usuarios.sql); esto es solo para no mostrar nada
     mientras no hay sesión. */
  (function(){
    try{
      var haySesion = Object.keys(localStorage).some(function(k){
        return k.indexOf('-auth-token') !== -1 && !!localStorage.getItem(k);
      });
      if(!haySesion){ window.location.replace('login.html'); }
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#4A9FD1; --navy-deep:#3A82AE; --teal:#4AB39F; --teal-deep:#3B9684;
    --app-bg:#0E1520; --section-surface:rgba(35,42,51,.76); --card-surface:rgba(43,51,61,.70);
    --border-soft:rgba(190,207,224,.10);
    --bg:var(--app-bg); --surface:#252E38; --surface-alt:#303B47; --line:var(--border-soft);
    --ink:#EAF0F6; --ink-soft:#A8B5C4; --ink-dim:#78879A;
    --danger:#D46A63; --danger-bg:rgba(212,106,99,0.10);
    --ok:#4AAE83; --ok-bg:rgba(74,174,131,0.10);
    --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-xl:24px; --radius-pill:999px;
    --shadow-sm:0 6px 18px rgba(4,8,20,.22); --shadow-lg:0 24px 60px rgba(2,6,16,.40);
    --ease:cubic-bezier(.2,.8,.2,1);
    --glass-border:rgba(203,218,235,.10); --glass-blur:blur(18px) saturate(112%);
  }
  :root[data-theme="light"]{
    --navy:#477EA5; --navy-deep:#3D6D90; --teal:#318F82; --teal-deep:#297A6F;
    --app-bg:#EEF2F5; --section-surface:rgba(218,226,232,.78); --card-surface:rgba(231,237,241,.82);
    --border-soft:rgba(37,55,76,.09);
    --surface:#E9EEF2; --surface-alt:#DCE4E9; --line:var(--border-soft);
    --ink:#263548; --ink-soft:#657489; --ink-dim:#8B97A5;
    --danger:#C35E57; --danger-bg:rgba(195,94,87,0.08);
    --ok:#3D936F; --ok-bg:rgba(61,147,111,0.10);
    --shadow-sm:0 6px 18px rgba(10,18,45,.05); --shadow-lg:0 24px 60px rgba(6,12,32,.12);
    --glass-border:rgba(36,51,72,.09); --glass-blur:blur(18px) saturate(112%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;padding:24px;
    font-family:'Inter','Segoe UI',Arial,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;
    background:
      radial-gradient(circle at 10% -5%, rgba(74,179,159,0.10), transparent 45%),
      radial-gradient(circle at 95% 8%, rgba(74,159,209,0.12), transparent 42%),
      var(--bg);
    transition:background-color .25s var(--ease),color .25s var(--ease);
  }
  .wrap{max-width:920px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .topbar .subtitulo{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .link-volver{
    display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);text-decoration:none;
    font-size:13px;font-weight:600;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    transition:color .16s var(--ease),border-color .16s var(--ease);
  }
  .link-volver:hover{color:var(--ink);border-color:var(--teal);}
  .btn-logout{
    background:var(--surface-alt);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
  }
  .card{
    background:var(--section-surface);border:1px solid var(--glass-border);border-radius:var(--radius-xl);
    box-shadow:var(--shadow-lg);padding:24px;margin-bottom:20px;
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  }
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin:0 0 16px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .field{display:block;text-align:left;}
  .field span{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase;}
  .field input, .field select{
    width:100%;height:38px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;outline:none;
    transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
  }
  .field input:focus, .field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--ok-bg);}
  .form-actions{margin-top:16px;display:flex;align-items:center;gap:12px;}
  .btn-submit{
    height:40px;padding:0 20px;border:none;border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;
    transition:filter .16s var(--ease),transform .16s var(--ease);
  }
  .btn-submit:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
  .btn-submit:disabled{opacity:.6;cursor:default;}
  .msg{border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;}
  .msg.error{color:var(--danger);background:var(--danger-bg);}
  .msg.ok{color:var(--ok);background:var(--ok-bg);}
  .hint{margin:10px 0 0;font-size:11.5px;color:var(--ink-dim);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-dim);font-weight:600;padding:0 10px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  td select{
    height:32px;padding:0 8px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:12.5px;
  }
  .rol-status{font-size:11px;color:var(--ink-dim);margin-left:8px;}
  /* Permisos del perfil operativo restringido: áreas y acciones marcables. */
  .permisos{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card-surface);}
  .permisos-grupo + .permisos-grupo{margin-top:12px;}
  .permisos-titulo{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase;}
  .permisos-opciones{display:flex;flex-wrap:wrap;gap:8px;}
  .permiso-chk{
    display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;cursor:pointer;
    border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);font-size:12.5px;
    transition:border-color .16s var(--ease),background-color .16s var(--ease);
  }
  .permiso-chk:has(input:checked){border-color:var(--teal);background:var(--ok-bg);}
  .permiso-chk input{accent-color:var(--teal);margin:0;}
  .permisos .hint{margin-top:10px;}
  .permisos-resumen{font-size:12px;color:var(--ink-soft);}
  .btn-mini{
    height:30px;padding:0 12px;margin-left:8px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface-alt);color:var(--ink);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;
  }
  .btn-mini:hover{border-color:var(--teal);}
  tr.fila-permisos td{padding-top:0;}
  .btn-mini.peligro{color:var(--danger);}
  .btn-mini.peligro:hover{border-color:var(--danger);background:var(--danger-bg);}
  .acciones-celda{white-space:nowrap;}
  .acciones-celda .btn-mini:first-child{margin-left:0;}
  /* Campo de contraseña con botón "ojito" para mostrar / ocultar. */
  .pass-wrap{position:relative;display:block;}
  .pass-wrap input{padding-right:40px;}
  .pass-ojo{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:32px;height:30px;display:grid;place-items:center;border:none;background:none;
    color:var(--ink-dim);cursor:pointer;border-radius:var(--radius-sm);
  }
  .pass-ojo:hover{color:var(--ink);}
  .pass-ojo:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ok-bg);}
  .pass-ojo svg{width:18px;height:18px;}
  .pass-ojo .ojo-cerrado{display:none;}
  .pass-ojo.is-visible .ojo-abierto{display:none;}
  .pass-ojo.is-visible .ojo-cerrado{display:block;}
  .fila-pass{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .fila-pass .field{flex:1;min-width:200px;max-width:320px;}
  /* Perfiles: país, código comercial, estado y resumen de permisos efectivos. */
  .wrap{max-width:1120px;}
  td input.input-mini{
    height:32px;width:150px;padding:0 8px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:6px;display:block;
  }
  .celda-sub{display:block;font-size:11px;color:var(--ink-dim);margin-top:3px;}
  tr.is-inactivo td{opacity:.55;}
  tr.is-inactivo td.acciones-celda{opacity:1;}
  .chip-estado{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:var(--radius-pill);font-size:10.5px;font-weight:600;vertical-align:middle;}
  .chip-estado.off{color:var(--danger);background:var(--danger-bg);}
  .perm-det summary{cursor:pointer;font-size:12px;color:var(--ink-soft);list-style:none;display:inline-flex;align-items:center;gap:6px;}
  .perm-det summary::-webkit-details-marker{display:none;}
  .perm-det summary::before{content:'▸';font-size:10px;transition:transform .16s var(--ease);}
  .perm-det[open] summary::before{transform:rotate(90deg);}
  .perm-det ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;min-width:260px;}
  .perm-det li{font-size:12px;color:var(--ink-soft);line-height:1.4;}
  .perm-det li b{color:var(--ink);font-weight:600;}
  .perm-det li.no b{color:var(--ink-dim);}
  .perm-det .btn-mini{margin:8px 0 0;}
  #nuevo-codigo-wrap[hidden]{display:none;}
  .empty-state, .access-denied{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:13px;}
  .access-denied h2{font-family:'Space Grotesk',sans-serif;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Gestión de usuarios</h1>
      <p class="subtitulo">Cuentas, perfiles, países y permisos — Control de Oportunidades</p>
    </div>
    <div class="topbar-actions">
      <a href="index.html" class="link-volver">← Volver al panel</a>
      <button type="button" class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </div>
  </div>

  <div id="contenido">
    <div class="card"><p class="empty-state">Verificando permisos…</p></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tfzanbbdvzullwlauxia.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_q-RLhPZqhDtnPHhmkkXaHA_d7FRXHC6';
let db = null;
let rolesDisponibles = [];
/* Sin la columna usuario.permisos (supabase/25 sin correr) la lista igual
   carga, pero no se pueden asignar permisos. */
let hayColumnaPermisos = true;
/* Sin usuario.pais / usuario.codigo_comercial (supabase/31 sin correr) la
   lista carga con los perfiles de antes y sin país. */
let hayColumnasPerfil = true;

/* ============================================================
   PERFILES — ver supabase/31_perfiles_permisos.sql.
   Cada perfil fija sus países posibles y sus permisos efectivos; la base los
   aplica (RLS + triggers) y esta vista solo los asigna y los muestra.
   Perú + Colombia es exclusivo de Administrador y Gerencia.
   ============================================================ */
const PERFILES = {
  admin:                 {label:'Administrador',             paises:['ambos']},
  gerencia:              {label:'Gerencia',                  paises:['ambos']},
  ejecutivo:             {label:'Ejecutivo comercial',       paises:['peru', 'colombia']},
  visor:                 {label:'Visor técnico',             paises:['peru']},
  operativo_restringido: {label:'Visor técnico restringido', paises:['peru']},
  editor:                {label:'Editor (perfil anterior)',  paises:['peru']},
};
const ORDEN_PERFILES = ['admin', 'gerencia', 'ejecutivo', 'visor', 'operativo_restringido', 'editor'];
const PAIS_LABEL = {peru:'Perú', colombia:'Colombia', ambos:'Perú + Colombia'};
function perfilLabel(rol){ return (PERFILES[rol] && PERFILES[rol].label) || rol || 'sin perfil'; }
function paisesDePerfil(rol){ return (PERFILES[rol] && PERFILES[rol].paises) || ['peru']; }
/* País que corresponde al perfil, conservando el actual si es válido. */
function paisParaPerfil(rol, actual){
  const ok = paisesDePerfil(rol);
  return ok.indexOf(actual) !== -1 ? actual : ok[0];
}

/* PERFIL TÉCNICO RESTRINGIDO — ver supabase/25 y 31. Áreas y vistas se
   configuran por persona; las acciones quedan limitadas a consulta. */
const ROL_RESTRINGIDO = 'operativo_restringido';
const AREAS_PERMISO = [
  {value:'comercial',    label:'Comercial'},
  {value:'arquitectura', label:'Arquitectura'},
  {value:'presupuestos', label:'Presupuestos e Ingeniería'},
];
/* Pestañas que puede abrir. Desempeño muestra solo lo de sus áreas. */
const VISTAS_PERMISO = [
  {value:'revision',  label:'Revisión semanal'},
  {value:'carga',     label:'Carga laboral'},
  {value:'desempeno', label:'Desempeño'},
];
const ACCIONES_SOLO_CONSULTA = {ver:true, crear:false, editar:false, completar_tareas:false, actualizar_avance:false};
const PERMISOS_INICIALES = {areas:[], vistas:['revision', 'carga'], acciones:ACCIONES_SOLO_CONSULTA};
let permisosPorUsuario = {};
let usuariosPorId = {};

function rolDescripcion(rolId){
  const r = rolesDisponibles.find(function(x){ return x.identificador === Number(rolId); });
  return r ? r.descripcion : '';
}

/* Bloque de casillas. "clave" distingue el formulario de alta de cada fila. */
function permisosHtml(clave, permisos){
  const p = permisos || PERMISOS_INICIALES;
  const vistas = Array.isArray(p.vistas) ? p.vistas : PERMISOS_INICIALES.vistas;
  const chk = function(tipo, op, marcado){
    return '<label class="permiso-chk"><input type="checkbox" data-permiso="' + tipo + '" value="' + op.value + '"' + (marcado ? ' checked' : '') + '>' + escapeHtml(op.label) + '</label>';
  };
  return '<div class="permisos" data-permisos="' + escapeHtml(clave) + '">' +
    '<div class="permisos-grupo"><span class="permisos-titulo">Áreas que ve</span><div class="permisos-opciones">' +
      AREAS_PERMISO.map(function(a){ return chk('area', a, (p.areas || []).indexOf(a.value) !== -1); }).join('') +
    '</div></div>' +
    '<div class="permisos-grupo"><span class="permisos-titulo">Vistas</span><div class="permisos-opciones">' +
      VISTAS_PERMISO.map(function(v){ return chk('vista', v, vistas.indexOf(v.value) !== -1); }).join('') +
    '</div></div>' +
    '<div class="permisos-grupo"><span class="permisos-titulo">Acciones</span><div class="permisos-opciones">' +
      '<label class="permiso-chk"><input type="checkbox" checked disabled>Ver (solo consulta)</label>' +
    '</div></div>' +
    '<p class="hint">Ve solo las vistas marcadas, con las tareas de sus áreas y sin importes. El perfil técnico es de consulta: no crea, edita ni completa tareas.</p>' +
  '</div>';
}

function leerPermisos(clave){
  const caja = document.querySelector('[data-permisos="' + clave + '"]');
  const areas = [], vistas = [];
  caja.querySelectorAll('input[data-permiso="area"]').forEach(function(i){ if(i.checked) areas.push(i.value); });
  caja.querySelectorAll('input[data-permiso="vista"]').forEach(function(i){ if(i.checked) vistas.push(i.value); });
  return {areas: areas, vistas: vistas, acciones: Object.assign({}, ACCIONES_SOLO_CONSULTA)};
}

function permisosValidos(p){
  if(!p.areas.length) return 'Marcá al menos un área.';
  if(!p.vistas.length) return 'Marcá al menos una vista.';
  if(p.vistas.indexOf('desempeno') !== -1 && p.vistas.indexOf('carga') === -1) return 'Desempeño se abre desde Carga laboral: marcá también Carga laboral.';
  return '';
}

function permisosRestringidoTxt(p){
  if(!p || !p.areas || !p.areas.length) return 'Sin áreas asignadas';
  const areas = p.areas.map(function(a){ const x = AREAS_PERMISO.find(function(y){ return y.value === a; }); return x ? x.label : a; }).join(' + ');
  const vistas = (Array.isArray(p.vistas) ? p.vistas : PERMISOS_INICIALES.vistas)
    .map(function(v){ const x = VISTAS_PERMISO.find(function(y){ return y.value === v; }); return x ? x.label : v; });
  return areas + ' · ' + vistas.join(', ');
}

/* Permisos efectivos por módulo según perfil y país. Es lo que aplica la base
   (supabase/31); acá solo se describe. [módulo, texto, permitido] */
function permisosEfectivos(u){
  const rol = u.rol, pais = PAIS_LABEL[u.pais] || PAIS_LABEL[paisParaPerfil(rol, u.pais)];
  const L = [];
  if(rol === 'admin'){
    L.push(['Países', 'Perú + Colombia', true]);
    L.push(['Planner', 'consulta y edita todo', true]);
    L.push(['Gestión Comercial', 'todo el equipo, los dos países', true]);
    L.push(['Conversiones', 'valida y aprueba', true]);
    L.push(['Gerencia', 'todas las subvistas', true]);
    L.push(['Usuarios', 'administra, cambia contraseñas', true]);
    L.push(['Eliminación definitiva', 'sí', true]);
  } else if(rol === 'gerencia'){
    L.push(['Países', 'Perú + Colombia', true]);
    L.push(['Planner', 'consulta y edita todo (como admin)', true]);
    L.push(['Control de horarios', 'administra, como admin', true]);
    L.push(['Gestión Comercial', 'consulta todo el equipo, los dos países', true]);
    L.push(['Conversiones', 'aprueba o rechaza las validadas por administración', true]);
    L.push(['Gerencia', 'todas las subvistas', true]);
    L.push(['Usuarios', 'no', false]);
  } else if(rol === 'ejecutivo'){
    L.push(['País', pais, true]);
    L.push(['Planner', 'consulta todas las oportunidades de su país; en las suyas (KAM) edita solo «Información general»', true]);
    L.push(['Revisión semanal', 'reordena el tablero (orden y columna de prioridad)', true]);
    L.push(['Calendario · tareas', 'consulta: no mueve tareas entre fechas', false]);
    L.push(['Gestión de equipos', 'solo consulta', true]);
    L.push(['Gestión Comercial', 'crea y edita sus leads, agenda, visitas y tareas', true]);
    L.push(['Tareas en sus oportunidades', 'Comercial: las crea en proceso. Arquitectura y Presupuestos: las solicita (por habilitar, sin responsable); Administración o Gerencia asigna al arquitecto o presupuestador y la habilita. No las modifica; puede retirar la solicitud mientras siga por habilitar', true]);
    L.push(['Leads y agenda de otros ejecutivos', 'no los ve', false]);
    L.push(['Código KAM', u.codigo_comercial || 'sin código: sus conversiones quedarán con KAM «otro»', !!u.codigo_comercial]);
    L.push(['Base Maestra de Clientes', 'compartida: consulta y registra clientes', true]);
    L.push(['Conversiones', 'solicita · el lead queda en consulta al solicitar', true]);
    L.push(['Usuarios · eliminación', 'no', false]);
  } else if(rol === ROL_RESTRINGIDO){
    L.push(['País', 'Perú', true]);
    L.push(['Áreas y vistas', permisosRestringidoTxt(u.permisos), true]);
    L.push(['Acciones', 'solo consulta, sin importes ni márgenes', true]);
    L.push(['Gestión Comercial · Gerencia', 'no', false]);
  } else if(rol === 'visor'){
    L.push(['País', 'Perú', true]);
    L.push(['Planner', 'consulta (solo lectura)', true]);
    L.push(['Gestión Comercial', 'solo lo que tenga asignado, en consulta', true]);
    L.push(['Edición · usuarios', 'no', false]);
  } else if(rol === 'editor'){
    L.push(['País', 'Perú', true]);
    L.push(['Planner', 'consulta y edita', true]);
    L.push(['Gestión Comercial', 'solo lo propio', true]);
    L.push(['Usuarios', 'no', false]);
  } else {
    L.push(['Acceso', 'sin perfil: no ve datos', false]);
  }
  if(u.activo === false) L.unshift(['Estado', 'desactivado: no puede entrar (historial conservado)', false]);
  return L;
}

function permisosResumenHtml(u){
  const items = permisosEfectivos(u);
  return '<details class="perm-det"><summary>' + escapeHtml(perfilLabel(u.rol)) + ' · ver permisos</summary><ul>' +
    items.map(function(x){ return '<li class="' + (x[2] ? '' : 'no') + '"><b>' + escapeHtml(x[0]) + ':</b> ' + escapeHtml(x[1]) + '</li>'; }).join('') +
    '</ul>' +
    (u.rol === ROL_RESTRINGIDO && hayColumnaPermisos
      ? '<button type="button" class="btn-mini" onclick="abrirEditorPermisos(&quot;' + escapeHtml(u.identificador) + '&quot;)">Editar áreas y vistas</button>'
      : '') +
    (u.rol === ROL_RESTRINGIDO && !hayColumnaPermisos ? '<p class="hint">Falta correr supabase/25.</p>' : '') +
  '</details>';
}

/* Sin tildes ni signos, en minúsculas: "Thalía Pérez Ruiz" → ["thalia","perez","ruiz"]. */
function tokensNombre(nombre){
  return String(nombre || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z\s]/g, '').trim().split(/\s+/).filter(Boolean);
}
/* Usuario sugerido: primer nombre + primer apellido ("thalia.perez"). */
function usuarioSugerido(nombre){ return tokensNombre(nombre).slice(0, 2).join('.'); }
/* Código comercial (KAM) sugerido: "hugo_escobar"; en Colombia "co_vivian_castrillon". */
function codigoSugerido(nombre, pais){
  const base = tokensNombre(nombre).slice(0, 2).join('_');
  return base ? (pais === 'colombia' ? 'co_' : '') + base : '';
}

/* Igual que en login.html: Supabase Auth identifica por correo, así que el
   usuario que se elija acá se convierte en "usuario@friopacking.pe" para
   crear la cuenta. Ese correo no necesita existir. El usuario elegido se
   guarda además en la columna `usuario_login` de la tabla `usuario`, porque
   auth.users no se puede leer desde el navegador y si no no habría forma de
   mostrar con qué usuario entra cada persona. */
const DOMINIO_USUARIOS = 'friopacking.pe';

function correoDesdeUsuario(entrada){
  const v = String(entrada || '').trim().toLowerCase();
  return v.includes('@') ? v : v + '@' + DOMINIO_USUARIOS;
}

/* id de la cuenta del admin que usa esta vista: no puede eliminarse ni desactivarse. */
let miUid = null;
/* Mientras se crea una cuenta, los cambios de sesión de signUp no repintan. */
let creandoUsuario = false;

/* Input de contraseña con el botón para verla. */
function passHtml(id){
  return '<span class="pass-wrap"><input type="password" id="' + id + '" minlength="6" required autocomplete="new-password">' +
    '<button type="button" class="pass-ojo" onclick="alternarVerPass(this)" aria-label="Mostrar contraseña" title="Mostrar contraseña">' +
      '<svg class="ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' +
      '<svg class="ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.4-1.6M3 3l18 18M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>' +
    '</button></span>';
}
function alternarVerPass(btn){
  const input = btn.parentNode.querySelector('input');
  const ver = input.type === 'password';
  input.type = ver ? 'text' : 'password';
  btn.classList.toggle('is-visible', ver);
  const txt = ver ? 'Ocultar contraseña' : 'Mostrar contraseña';
  btn.setAttribute('aria-label', txt); btn.title = txt;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* Función RPC que todavía no existe en la base (script sin correr). */
function faltaFuncion(error, nombre){
  const m = String((error && (error.message || error.hint)) || '');
  return (error && (error.code === 'PGRST202' || error.code === '42883')) || m.indexOf(nombre) !== -1;
}

async function cargarRoles(){
  const {data, error} = await db.from('roles').select('identificador, descripcion');
  if(error){ console.error('No se pudieron cargar los roles:', error); return; }
  rolesDisponibles = (data || []).slice().sort(function(a, b){
    const ia = ORDEN_PERFILES.indexOf(a.descripcion), ib = ORDEN_PERFILES.indexOf(b.descripcion);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
}

function opcionesRol(rolIdSeleccionado){
  return rolesDisponibles.map(function(r){
    return '<option value="' + r.identificador + '"' + (r.identificador === rolIdSeleccionado ? ' selected' : '') + '>' + escapeHtml(perfilLabel(r.descripcion)) + '</option>';
  }).join('');
}

function opcionesPais(rol, sel){
  return paisesDePerfil(rol).map(function(p){
    return '<option value="' + p + '"' + (p === sel ? ' selected' : '') + '>' + PAIS_LABEL[p] + '</option>';
  }).join('');
}

async function cargarUsuarios(){
  /* Se piden las columnas nuevas y, si la base todavía no las tiene, se
     reintenta sin ellas: la gestión de usuarios no se cae por un script sin
     correr. */
  const base = 'identificador, nombre, usuario_login, rol_id, activo, roles(descripcion)';
  let {data, error} = await db.from('usuario').select(base + ', permisos, pais, codigo_comercial').order('nombre');
  if(error){
    const r = await db.from('usuario').select(base + ', permisos').order('nombre');
    if(!r.error){ hayColumnasPerfil = false; data = r.data; error = null; }
    else{
      const r2 = await db.from('usuario').select(base).order('nombre');
      if(!r2.error){ hayColumnasPerfil = false; hayColumnaPermisos = false; data = r2.data; error = null; }
    }
  }
  const tbody = document.getElementById('tabla-usuarios-body');
  const aviso = document.getElementById('aviso-migracion');
  if(aviso) aviso.hidden = hayColumnasPerfil;
  if(error){
    tbody.innerHTML = '<tr><td colspan="6"><p class="msg error">No se pudo cargar la lista de usuarios: ' + escapeHtml(error.message) + '</p></td></tr>';
    return;
  }
  if(!data || !data.length){
    tbody.innerHTML = '<tr><td colspan="6"><p class="empty-state">Todavía no hay usuarios cargados.</p></td></tr>';
    return;
  }
  permisosPorUsuario = {};
  usuariosPorId = {};
  data.forEach(function(u){
    u.rol = (u.roles && u.roles.descripcion) || rolDescripcion(u.rol_id);
    permisosPorUsuario[u.identificador] = u.permisos || null;
    usuariosPorId[u.identificador] = u;
  });
  /* Activos primero; dentro de cada grupo, por perfil y nombre. */
  data.sort(function(a, b){
    return ((a.activo === false) - (b.activo === false)) ||
      (ORDEN_PERFILES.indexOf(a.rol) - ORDEN_PERFILES.indexOf(b.rol)) ||
      String(a.nombre).localeCompare(String(b.nombre), 'es');
  });
  tbody.innerHTML = data.map(filaUsuarioHtml).join('');
}

function filaUsuarioHtml(u){
  /* El identificador es un uuid, no un número: va entre comillas dentro de los
     handlers. Sin las comillas, 2cb308f1-6236-... se interpreta como una resta
     de identificadores y rompe el handler con un error de sintaxis. */
  const id = escapeHtml(u.identificador);
  const inactivo = u.activo === false;
  const esYo = u.identificador === miUid;
  const paises = paisesDePerfil(u.rol);
  const paisActual = paisParaPerfil(u.rol, u.pais);
  const celdaPais = hayColumnasPerfil
    ? '<select onchange="handleCambiarPais(&quot;' + id + '&quot;, this)"' + (paises.length < 2 ? ' disabled' : '') + '>' + opcionesPais(u.rol, paisActual) + '</select>' +
      (u.rol === 'ejecutivo'
        ? '<input class="input-mini" type="text" value="' + escapeHtml(u.codigo_comercial || '') + '" placeholder="código KAM" title="Código comercial: la clave de KAM con la que se crean sus oportunidades convertidas" spellcheck="false" onchange="handleCambiarCodigo(&quot;' + id + '&quot;, this)">'
        : '') +
      '<span class="rol-status" id="pais-status-' + id + '"></span>'
    : '<span class="celda-sub">Falta correr supabase/31</span>';
  return '<tr data-id="' + id + '"' + (inactivo ? ' class="is-inactivo"' : '') + '>' +
    '<td>' + escapeHtml(u.nombre) + (inactivo ? '<span class="chip-estado off">Inactivo</span>' : '') + '</td>' +
    '<td>' + escapeHtml(u.usuario_login || '—') + '</td>' +
    '<td><select onchange="handleCambiarRol(&quot;' + id + '&quot;, this)"' + (esYo ? ' disabled title="No podés cambiar tu propio perfil"' : '') + '>' + opcionesRol(u.rol_id) + '</select><span class="rol-status" id="rol-status-' + id + '"></span></td>' +
    '<td>' + celdaPais + '</td>' +
    '<td id="permisos-celda-' + id + '">' + permisosResumenHtml(u) + '</td>' +
    '<td class="acciones-celda">' +
      '<button type="button" class="btn-mini" onclick="abrirCambioPass(&quot;' + id + '&quot;)">Contraseña</button>' +
      (esYo ? '' :
        '<button type="button" class="btn-mini" onclick="alternarActivo(&quot;' + id + '&quot;, this)">' + (inactivo ? 'Activar' : 'Desactivar') + '</button>' +
        '<button type="button" class="btn-mini peligro" onclick="eliminarUsuario(&quot;' + id + '&quot;, this)" data-nombre="' + escapeHtml(u.nombre) + '">Eliminar</button>') +
    '</td>' +
  '</tr>';
}

function abrirEditorPermisos(id){
  const previa = document.getElementById('fila-permisos-' + id);
  if(previa){ previa.remove(); return; }
  const fila = document.querySelector('tr[data-id="' + id + '"]');
  const tr = document.createElement('tr');
  tr.className = 'fila-permisos';
  tr.id = 'fila-permisos-' + id;
  tr.innerHTML = '<td colspan="6">' + permisosHtml(id, permisosPorUsuario[id]) +
    '<div class="form-actions"><button type="button" class="btn-submit" onclick="guardarPermisos(&quot;' + escapeHtml(id) + '&quot;, this)">Guardar permisos</button>' +
    '<span class="rol-status" id="permisos-status-' + escapeHtml(id) + '"></span></div></td>';
  fila.after(tr);
}

async function guardarPermisos(id, btn){
  const status = document.getElementById('permisos-status-' + id);
  const p = leerPermisos(id);
  const invalido = permisosValidos(p);
  if(invalido){ status.textContent = invalido; return; }
  btn.disabled = true; status.textContent = 'Guardando…';
  const {error} = await db.from('usuario').update({permisos: p}).eq('identificador', id);
  btn.disabled = false;
  if(error){ console.error('No se pudieron guardar los permisos:', error); status.textContent = 'Error al guardar'; return; }
  permisosPorUsuario[id] = p;
  if(usuariosPorId[id]) usuariosPorId[id].permisos = p;
  document.getElementById('permisos-celda-' + id).innerHTML = permisosResumenHtml(usuariosPorId[id]);
  document.getElementById('fila-permisos-' + id).remove();
}

/* Cambio de contraseña: fila desplegable bajo el usuario. La contraseña actual
   no se puede mostrar (Supabase la guarda cifrada); solo se reemplaza. */
function abrirCambioPass(id){
  const previa = document.getElementById('fila-pass-' + id);
  if(previa){ previa.remove(); return; }
  const fila = document.querySelector('tr[data-id="' + id + '"]');
  const tr = document.createElement('tr');
  tr.className = 'fila-permisos';
  tr.id = 'fila-pass-' + id;
  tr.innerHTML = '<td colspan="6"><div class="permisos"><div class="fila-pass">' +
      '<label class="field"><span>Nueva contraseña</span>' + passHtml('pass-' + id) + '</label>' +
      '<button type="button" class="btn-submit" onclick="guardarContrasena(&quot;' + escapeHtml(id) + '&quot;, this)">Guardar contraseña</button>' +
      '<span class="rol-status" id="pass-status-' + escapeHtml(id) + '"></span>' +
    '</div><p class="hint">La contraseña actual no se puede ver: se guarda cifrada. Escribí la nueva y pasásela a la persona.</p></div></td>';
  fila.after(tr);
  document.getElementById('pass-' + id).focus();
}

async function guardarContrasena(id, btn){
  const input = document.getElementById('pass-' + id);
  const status = document.getElementById('pass-status-' + id);
  if(input.value.length < 6){ status.textContent = 'Mínimo 6 caracteres.'; return; }
  btn.disabled = true; status.textContent = 'Guardando…';
  const {error} = await db.rpc('admin_cambiar_contrasena', {p_uid: id, p_password: input.value});
  btn.disabled = false;
  if(error){
    console.error('No se pudo cambiar la contraseña:', error);
    status.textContent = faltaFuncion(error, 'admin_cambiar_contrasena') ? 'Falta correr supabase/27' : (error.message || 'Error al guardar');
    return;
  }
  status.textContent = 'Contraseña cambiada ✓';
  setTimeout(function(){ const f = document.getElementById('fila-pass-' + id); if(f) f.remove(); }, 1500);
}

/* Activar / desactivar: la cuenta deja de entrar y de ver datos, pero su
   perfil, sus registros y el historial se conservan (a diferencia de Eliminar). */
async function alternarActivo(id, btn){
  const u = usuariosPorId[id]; if(!u) return;
  const activar = u.activo === false;
  if(!activar && !confirm('¿Desactivar a ' + u.nombre + '? No podrá entrar al panel. Sus registros e historial se conservan y podés reactivarlo cuando quieras.')) return;
  btn.disabled = true; btn.textContent = activar ? 'Activando…' : 'Desactivando…';
  let {error} = await db.rpc('admin_activar_usuario', {p_uid: id, p_activo: activar});
  if(error && faltaFuncion(error, 'admin_activar_usuario')){
    /* Sin supabase/31: se marca el perfil (sin perfil activo no ve datos), pero
       la cuenta podría seguir iniciando sesión. */
    const r = await db.from('usuario').update({activo: activar}).eq('identificador', id);
    error = r.error;
    if(!error) alert('Perfil ' + (activar ? 'activado' : 'desactivado') + '. Para bloquear también el inicio de sesión corré supabase/31_perfiles_permisos.sql.');
  }
  if(error){
    console.error('No se pudo cambiar el estado del usuario:', error);
    alert(error.message || 'No se pudo cambiar el estado del usuario.');
    btn.disabled = false; btn.textContent = activar ? 'Activar' : 'Desactivar';
    return;
  }
  cargarUsuarios();
}

async function eliminarUsuario(id, btn){
  const nombre = btn.dataset.nombre || 'este usuario';
  if(!confirm('¿Eliminar DEFINITIVAMENTE a ' + nombre + '? Se borra su cuenta y su perfil, y no se puede deshacer.\n\nSi solo querés que deje de entrar, usá «Desactivar»: conserva su historial.')) return;
  btn.disabled = true; btn.textContent = 'Eliminando…';
  const {error} = await db.rpc('admin_eliminar_usuario', {p_uid: id});
  if(error){
    console.error('No se pudo eliminar el usuario:', error);
    alert(faltaFuncion(error, 'admin_eliminar_usuario') ? 'Falta correr supabase/27_admin_contrasena_eliminar.sql en Supabase.' : (error.message || 'No se pudo eliminar el usuario.'));
    btn.disabled = false; btn.textContent = 'Eliminar';
    return;
  }
  cargarUsuarios();
}

function mostrarEstado(idStatus, error, ok){
  const status = document.getElementById(idStatus);
  if(!status) return;
  status.textContent = error ? (error.message || 'Error al guardar') : (ok || 'Guardado ✓');
  setTimeout(function(){ status.textContent = ''; }, error ? 5000 : 2500);
}

/* Cambio de perfil: el país se ajusta solo al que el perfil admite (Perú +
   Colombia solo para Administrador y Gerencia). La base lo vuelve a aplicar
   con un trigger, así que acá se recarga la lista para mostrar lo guardado. */
async function handleCambiarRol(id, select){
  const u = usuariosPorId[id] || {};
  const rol = rolDescripcion(select.value);
  const cambios = {rol_id: Number(select.value)};
  if(hayColumnasPerfil) cambios.pais = paisParaPerfil(rol, u.pais);
  document.getElementById('rol-status-' + id).textContent = 'Guardando…';
  const {error} = await db.from('usuario').update(cambios).eq('identificador', id);
  if(error){
    console.error('No se pudo cambiar el perfil:', error);
    mostrarEstado('rol-status-' + id, error);
    select.value = u.rol_id;
    return;
  }
  await cargarUsuarios();
  /* Al pasar al perfil restringido se abren sus permisos para asignarlos:
     sin áreas, la persona entra y no ve nada. */
  if(rol === ROL_RESTRINGIDO && hayColumnaPermisos && !(permisosPorUsuario[id] && (permisosPorUsuario[id].areas || []).length)){
    abrirEditorPermisos(id);
  }
  mostrarEstado('rol-status-' + id, null);
}

async function handleCambiarPais(id, select){
  const u = usuariosPorId[id] || {};
  const cambios = {pais: select.value};
  /* El código comercial de Colombia lleva el prefijo co_ (KAM de esa operación). */
  if(u.rol === 'ejecutivo' && u.codigo_comercial && u.codigo_comercial === codigoSugerido(u.nombre, u.pais)){
    cambios.codigo_comercial = codigoSugerido(u.nombre, select.value);
  }
  const {error} = await db.from('usuario').update(cambios).eq('identificador', id);
  if(error){ console.error('No se pudo cambiar el país:', error); select.value = paisParaPerfil(u.rol, u.pais); mostrarEstado('pais-status-' + id, error); return; }
  await cargarUsuarios();
  mostrarEstado('pais-status-' + id, null);
}

async function handleCambiarCodigo(id, input){
  const v = input.value.trim().toLowerCase();
  const {error} = await db.from('usuario').update({codigo_comercial: v || null}).eq('identificador', id);
  if(error){ console.error('No se pudo guardar el código comercial:', error); mostrarEstado('pais-status-' + id, error); return; }
  await cargarUsuarios();
  mostrarEstado('pais-status-' + id, null);
}

async function handleCrearUsuario(ev){
  ev.preventDefault();
  const nombre = document.getElementById('nuevo-nombre').value.trim();
  const usuarioLogin = document.getElementById('nuevo-usuario').value.trim().toLowerCase();
  const email = correoDesdeUsuario(usuarioLogin);
  const password = document.getElementById('nuevo-password').value;
  const rolId = Number(document.getElementById('nuevo-rol').value);
  const rol = rolDescripcion(rolId);
  const pais = paisParaPerfil(rol, document.getElementById('nuevo-pais').value);
  const codigo = document.getElementById('nuevo-codigo').value.trim().toLowerCase();
  const btn = document.getElementById('btn-crear-usuario');
  const msg = document.getElementById('crear-usuario-msg');
  msg.hidden = true;
  const restringido = rol === ROL_RESTRINGIDO;
  const permisos = restringido ? leerPermisos('nuevo') : null;
  const invalido = permisos ? permisosValidos(permisos) : '';
  if(invalido){
    msg.className = 'msg error'; msg.textContent = invalido; msg.hidden = false;
    return;
  }
  btn.disabled = true; btn.textContent = 'Creando…';
  creandoUsuario = true;

  try{
    /* Único mecanismo disponible sin backend propio para crear una cuenta de
       Supabase Auth es signUp con la clave anon. El problema: si el proyecto
       tiene "Confirm email" desactivado, signUp deja logueado automáticamente
       al usuario recién creado en ESTE cliente, pisando la sesión del admin
       que está usando este formulario. Por eso se guarda la sesión actual
       antes y se restaura después, pase lo que pase. */
    const {data:{session: sesionAdmin}} = await db.auth.getSession();

    const {data, error} = await db.auth.signUp({email, password});
    if(sesionAdmin){
      await db.auth.setSession({access_token: sesionAdmin.access_token, refresh_token: sesionAdmin.refresh_token});
    }
    creandoUsuario = false;
    if(error) throw error;
    if(!data.user){ throw new Error('Supabase no devolvió el usuario creado.'); }

    /* `identificador` es uuid, no tiene valor por defecto y además lleva una
       clave foránea contra auth.users(id): no se puede generar al azar, tiene
       que ser el id de la cuenta recién creada. `auth_user_id` apunta a lo
       mismo (es el vínculo que consulta el panel), así que se escribe el mismo
       valor en las dos para que no queden desfasadas. */
    const {error: errPerfil} = await db.from('usuario').insert({
      identificador: data.user.id,
      auth_user_id: data.user.id,
      usuario_login: usuarioLogin,
      nombre: nombre,
      rol_id: rolId,
      ...(permisos ? {permisos: permisos} : {}),
      ...(hayColumnasPerfil ? {pais: pais} : {}),
      ...(hayColumnasPerfil && rol === 'ejecutivo' ? {codigo_comercial: codigo || codigoSugerido(nombre, pais)} : {}),
    });
    if(errPerfil) throw errPerfil;

    msg.className = 'msg ok';
    msg.textContent = 'Usuario creado con el perfil ' + perfilLabel(rol) + ' · ' + PAIS_LABEL[pais] + '. Si el proyecto tiene "Confirm email" activado en Supabase, la persona debe confirmar su correo antes de poder ingresar.';
    msg.hidden = false;
    document.getElementById('form-crear-usuario').reset();
    usuarioEditadoAMano = false; codigoEditadoAMano = false;
    const ojo = document.querySelector('#form-crear-usuario .pass-ojo.is-visible');
    if(ojo) alternarVerPass(ojo);
    actualizarFormularioNuevo();
    cargarUsuarios();
  }catch(e){
    console.error('Error al crear usuario:', e);
    msg.className = 'msg error';
    msg.textContent = e.message || 'No se pudo crear el usuario.';
    msg.hidden = false;
  }finally{
    creandoUsuario = false;
    btn.disabled = false; btn.textContent = 'Crear usuario';
  }
}

          '<label class="field"><span>Usuario</span><input type="text" id="nuevo-usuario" autocapitalize="none" spellcheck="false" required></label>' +
          '<label class="field"><span>Contraseña</span>' + passHtml('nuevo-password') + '</label>' +
          '<label class="field"><span>Perfil</span><select id="nuevo-rol" required>' + opcionesRol(null) + '</select></label>' +
          '<label class="field"><span>País asignado</span><select id="nuevo-pais"></select></label>' +
          '<label class="field" id="nuevo-codigo-wrap" hidden><span>Código comercial (KAM)</span><input type="text" id="nuevo-codigo" autocapitalize="none" spellcheck="false" placeholder="hugo_escobar"></label>' +
        '</div>' +
        '<div id="nuevo-permisos" hidden>' + permisosHtml('nuevo', null) + '</div>' +
        '<div class="form-actions">' +
          '<button type="submit" class="btn-submit" id="btn-crear-usuario">Crear usuario</button>' +
        '</div>' +
        '<p class="msg" id="crear-usuario-msg" hidden></p>' +
        '<p class="hint">La persona entra con ese usuario y esa contraseña. No hace falta ningún correo: por detrás la cuenta se crea como <b>usuario@' + DOMINIO_USUARIOS + '</b>, que no necesita existir. Si alguien olvida su contraseña, se la cambiás desde esta lista (botón Contraseña).</p>' +
        '<p class="hint">Los permisos se asignan solos según el perfil. Perú + Colombia es exclusivo de Administrador y Gerencia. El ejecutivo consulta todas las oportunidades de su país, edita la Información general de las suyas y reordena la Revisión semanal; su código comercial es la clave de KAM con la que se crean las oportunidades que nacen de sus conversiones.</p>' +
      '</form>' +
    '</div>' +
    '<div class="card">' +
      '<h2>Usuarios existentes</h2>' +
      '<p class="msg error" id="aviso-migracion" hidden>Falta correr <b>supabase/31_perfiles_permisos.sql</b>: hasta entonces no hay perfiles Gerencia / Ejecutivo comercial ni país asignado.</p>' +
      '<div style="overflow-x:auto"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Perfil</th><th>País</th><th>Permisos efectivos</th><th>Acciones</th></tr></thead><tbody id="tabla-usuarios-body">' +
        '<tr><td colspan="6"><p class="empty-state">Cargando…</p></td></tr>' +
      '</tbody></table></div>' +
    '</div>';
  document.getElementById('form-crear-usuario').addEventListener('submit', handleCrearUsuario);
  /* El usuario y el código se arman solos desde el nombre hasta que alguien los edite. */
  document.getElementById('nuevo-nombre').addEventListener('input', function(){
    if(!usuarioEditadoAMano) document.getElementById('nuevo-usuario').value = usuarioSugerido(this.value);
    sugerirCodigoNuevo();
  });
  document.getElementById('nuevo-usuario').addEventListener('input', function(){ usuarioEditadoAMano = !!this.value; });
  document.getElementById('nuevo-codigo').addEventListener('input', function(){ codigoEditadoAMano = !!this.value; });
  document.getElementById('nuevo-rol').addEventListener('change', actualizarFormularioNuevo);
  document.getElementById('nuevo-pais').addEventListener('change', sugerirCodigoNuevo);
  actualizarFormularioNuevo();
  cargarUsuarios();
}

let usuarioEditadoAMano = false, codigoEditadoAMano = false;
function sugerirCodigoNuevo(){
  if(codigoEditadoAMano) return;
  document.getElementById('nuevo-codigo').value = codigoSugerido(document.getElementById('nuevo-nombre').value, document.getElementById('nuevo-pais').value);
}
/* País según perfil; código comercial solo para ejecutivos; casillas de
   áreas y vistas solo para el perfil técnico restringido. */
function actualizarFormularioNuevo(){
  const sel = document.getElementById('nuevo-rol');
  if(!sel) return;
  const rol = rolDescripcion(sel.value);
  const selPais = document.getElementById('nuevo-pais');
  const actual = selPais.value;
  selPais.innerHTML = opcionesPais(rol, paisParaPerfil(rol, actual));
  selPais.disabled = paisesDePerfil(rol).length < 2 || !hayColumnasPerfil;
  document.getElementById('nuevo-codigo-wrap').hidden = rol !== 'ejecutivo' || !hayColumnasPerfil;
  document.getElementById('nuevo-permisos').hidden = rol !== ROL_RESTRINGIDO;
  sugerirCodigoNuevo();
}

async function verificarAccesoYRenderizar(session){
  const {data, error} = await db.from('usuario').select('rol_id, activo, roles(descripcion)').eq('auth_user_id', session.user.id).maybeSingle();
  if(error){ console.error('No se pudo verificar el rol:', error); renderAccesoDenegado(); return; }
  const rol = data && data.roles ? data.roles.descripcion : '';
  if(rol !== 'admin' || data.activo === false){ renderAccesoDenegado(); return; }
  miUid = session.user.id;
  await cargarRoles();
  renderPanelAdmin();
}

document.getElementById('btn-logout').addEventListener('click', async function(){
  if(db) await db.auth.signOut();
});

window.addEventListener('DOMContentLoaded', function(){
  if(typeof supabase === 'undefined'){
    document.getElementById('contenido').innerHTML = '<div class="card"><p class="msg error">No se pudo conectar con el servidor. Revisá tu conexión a internet y recargá la página.</p></div>';
    return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  /* Solo al iniciar o cambiar de sesión: una renovación de token, o el ida y
     vuelta de sesión que hace el alta de un usuario (signUp + setSession), no
     deben repintar la vista (borrarían el mensaje y lo que se esté escribiendo). */
  db.auth.onAuthStateChange(function(event, session){
    if(session){
      if(creandoUsuario || (miUid && session.user.id === miUid)) return;
      verificarAccesoYRenderizar(session);
    }else{
      window.location.replace('login.html');
    }
  });
});
</script>
