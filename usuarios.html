<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de usuarios — Control de Oportunidades</title>
<script>
  /* Guardia rápida: sin sesión guardada, ni vale la pena pintar esta vista.
     La restricción real por rol admin la hace RLS en Supabase (ver
     supabase/11_admin_usuarios.sql); esto es solo para no mostrar nada
     mientras no hay sesión. */
  (function(){
    try{
      var haySesion = Object.keys(localStorage).some(function(k){
        return k.indexOf('-auth-token') !== -1 && !!localStorage.getItem(k);
      });
      if(!haySesion){ window.location.replace('login.html'); }
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#4A9FD1; --navy-deep:#3A82AE; --teal:#4AB39F; --teal-deep:#3B9684;
    --app-bg:#0E1520; --section-surface:rgba(35,42,51,.76); --card-surface:rgba(43,51,61,.70);
    --border-soft:rgba(190,207,224,.10);
    --bg:var(--app-bg); --surface:#252E38; --surface-alt:#303B47; --line:var(--border-soft);
    --ink:#EAF0F6; --ink-soft:#A8B5C4; --ink-dim:#78879A;
    --danger:#D46A63; --danger-bg:rgba(212,106,99,0.10);
    --ok:#4AAE83; --ok-bg:rgba(74,174,131,0.10);
    --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-xl:24px; --radius-pill:999px;
    --shadow-sm:0 6px 18px rgba(4,8,20,.22); --shadow-lg:0 24px 60px rgba(2,6,16,.40);
    --ease:cubic-bezier(.2,.8,.2,1);
    --glass-border:rgba(203,218,235,.10); --glass-blur:blur(18px) saturate(112%);
  }
  :root[data-theme="light"]{
    --navy:#477EA5; --navy-deep:#3D6D90; --teal:#318F82; --teal-deep:#297A6F;
    --app-bg:#EEF2F5; --section-surface:rgba(218,226,232,.78); --card-surface:rgba(231,237,241,.82);
    --border-soft:rgba(37,55,76,.09);
    --surface:#E9EEF2; --surface-alt:#DCE4E9; --line:var(--border-soft);
    --ink:#263548; --ink-soft:#657489; --ink-dim:#8B97A5;
    --danger:#C35E57; --danger-bg:rgba(195,94,87,0.08);
    --ok:#3D936F; --ok-bg:rgba(61,147,111,0.10);
    --shadow-sm:0 6px 18px rgba(10,18,45,.05); --shadow-lg:0 24px 60px rgba(6,12,32,.12);
    --glass-border:rgba(36,51,72,.09); --glass-blur:blur(18px) saturate(112%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;padding:24px;
    font-family:'Inter','Segoe UI',Arial,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;
    background:
      radial-gradient(circle at 10% -5%, rgba(74,179,159,0.10), transparent 45%),
      radial-gradient(circle at 95% 8%, rgba(74,159,209,0.12), transparent 42%),
      var(--bg);
    transition:background-color .25s var(--ease),color .25s var(--ease);
  }
  .wrap{max-width:920px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .topbar .subtitulo{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .link-volver{
    display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);text-decoration:none;
    font-size:13px;font-weight:600;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    transition:color .16s var(--ease),border-color .16s var(--ease);
  }
  .link-volver:hover{color:var(--ink);border-color:var(--teal);}
  .btn-logout{
    background:var(--surface-alt);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:8px 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;
  }
  .card{
    background:var(--section-surface);border:1px solid var(--glass-border);border-radius:var(--radius-xl);
    box-shadow:var(--shadow-lg);padding:24px;margin-bottom:20px;
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  }
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin:0 0 16px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}
  .field{display:block;text-align:left;}
  .field span{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase;}
  .field input, .field select{
    width:100%;height:38px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;outline:none;
    transition:border-color .16s var(--ease),box-shadow .16s var(--ease);
  }
  .field input:focus, .field select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--ok-bg);}
  .form-actions{margin-top:16px;display:flex;align-items:center;gap:12px;}
  .btn-submit{
    height:40px;padding:0 20px;border:none;border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--teal-deep),var(--teal));color:#fff;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;
    transition:filter .16s var(--ease),transform .16s var(--ease);
  }
  .btn-submit:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);}
  .btn-submit:disabled{opacity:.6;cursor:default;}
  .msg{border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;}
  .msg.error{color:var(--danger);background:var(--danger-bg);}
  .msg.ok{color:var(--ok);background:var(--ok-bg);}
  .hint{margin:10px 0 0;font-size:11.5px;color:var(--ink-dim);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-dim);font-weight:600;padding:0 10px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  td select{
    height:32px;padding:0 8px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'Inter',sans-serif;font-size:12.5px;
  }
  .rol-status{font-size:11px;color:var(--ink-dim);margin-left:8px;}
  /* Permisos del perfil operativo restringido: áreas y acciones marcables. */
  .permisos{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card-surface);}
  .permisos-grupo + .permisos-grupo{margin-top:12px;}
  .permisos-titulo{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.03em;text-transform:uppercase;}
  .permisos-opciones{display:flex;flex-wrap:wrap;gap:8px;}
  .permiso-chk{
    display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;cursor:pointer;
    border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);font-size:12.5px;
    transition:border-color .16s var(--ease),background-color .16s var(--ease);
  }
  .permiso-chk:has(input:checked){border-color:var(--teal);background:var(--ok-bg);}
  .permiso-chk input{accent-color:var(--teal);margin:0;}
  .permisos .hint{margin-top:10px;}
  .permisos-resumen{font-size:12px;color:var(--ink-soft);}
  .btn-mini{
    height:30px;padding:0 12px;margin-left:8px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:var(--surface-alt);color:var(--ink);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;
  }
  .btn-mini:hover{border-color:var(--teal);}
  tr.fila-permisos td{padding-top:0;}
  .btn-mini.peligro{color:var(--danger);}
  .btn-mini.peligro:hover{border-color:var(--danger);background:var(--danger-bg);}
  .acciones-celda{white-space:nowrap;}
  .acciones-celda .btn-mini:first-child{margin-left:0;}
  /* Campo de contraseña con botón "ojito" para mostrar / ocultar. */
  .pass-wrap{position:relative;display:block;}
  .pass-wrap input{padding-right:40px;}
  .pass-ojo{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:32px;height:30px;display:grid;place-items:center;border:none;background:none;
    color:var(--ink-dim);cursor:pointer;border-radius:var(--radius-sm);
  }
  .pass-ojo:hover{color:var(--ink);}
  .pass-ojo:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ok-bg);}
  .pass-ojo svg{width:18px;height:18px;}
  .pass-ojo .ojo-cerrado{display:none;}
  .pass-ojo.is-visible .ojo-abierto{display:none;}
  .pass-ojo.is-visible .ojo-cerrado{display:block;}
  .fila-pass{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .fila-pass .field{flex:1;min-width:200px;max-width:320px;}
  .empty-state, .access-denied{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:13px;}
  .access-denied h2{font-family:'Space Grotesk',sans-serif;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Gestión de usuarios</h1>
      <p class="subtitulo">Alta de cuentas y roles — Control de Oportunidades</p>
    </div>
    <div class="topbar-actions">
      <a href="index.html" class="link-volver">← Volver al panel</a>
      <button type="button" class="btn-logout" id="btn-logout">Cerrar sesión</button>
    </div>
  </div>

  <div id="contenido">
    <div class="card"><p class="empty-state">Verificando permisos…</p></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tfzanbbdvzullwlauxia.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_q-RLhPZqhDtnPHhmkkXaHA_d7FRXHC6';
let db = null;
let rolesDisponibles = [];
/* Sin la columna usuario.permisos (supabase/25 sin correr) la lista igual
   carga, pero no se pueden asignar permisos. */
let hayColumnaPermisos = true;

/* PERFIL OPERATIVO RESTRINGIDO — ver supabase/25_perfil_operativo_restringido.sql.
   Solo ese rol lleva permisos propios: qué áreas ve y qué acciones puede hacer
   en ellas. admin / editor / visor siguen funcionando por rol, sin permisos. */
const ROL_RESTRINGIDO = 'operativo_restringido';
const AREAS_PERMISO = [
  {value:'comercial',    label:'Comercial'},
  {value:'arquitectura', label:'Arquitectura'},
  {value:'presupuestos', label:'Presupuestos e Ingeniería'},
];
/* Pestañas que puede abrir. Desempeño muestra solo lo de sus áreas. */
const VISTAS_PERMISO = [
  {value:'revision',  label:'Revisión semanal'},
  {value:'carga',     label:'Carga laboral'},
  {value:'desempeno', label:'Desempeño'},
];
const ACCIONES_PERMISO = [
  {value:'ver',               label:'Ver'},
  {value:'crear',             label:'Crear tareas'},
  {value:'editar',            label:'Editar tareas'},
  {value:'completar_tareas',  label:'Completar tareas'},
  {value:'actualizar_avance', label:'Actualizar avances'},
];
const PERMISOS_INICIALES = {areas:[], vistas:['revision', 'carga'], acciones:{ver:true}};
let permisosPorUsuario = {};

function rolDescripcion(rolId){
  const r = rolesDisponibles.find(function(x){ return x.identificador === Number(rolId); });
  return r ? r.descripcion : '';
}

/* Bloque de casillas. "clave" distingue el formulario de alta de cada fila. */
function permisosHtml(clave, permisos){
  const p = permisos || PERMISOS_INICIALES;
  const acciones = p.acciones || {};
  const vistas = Array.isArray(p.vistas) ? p.vistas : PERMISOS_INICIALES.vistas;
  const chk = function(tipo, op, marcado){
    return '<label class="permiso-chk"><input type="checkbox" data-permiso="' + tipo + '" value="' + op.value + '"' + (marcado ? ' checked' : '') + '>' + escapeHtml(op.label) + '</label>';
  };
  return '<div class="permisos" data-permisos="' + escapeHtml(clave) + '">' +
    '<div class="permisos-grupo"><span class="permisos-titulo">Áreas que ve</span><div class="permisos-opciones">' +
      AREAS_PERMISO.map(function(a){ return chk('area', a, (p.areas || []).indexOf(a.value) !== -1); }).join('') +
    '</div></div>' +
    '<div class="permisos-grupo"><span class="permisos-titulo">Vistas</span><div class="permisos-opciones">' +
      VISTAS_PERMISO.map(function(v){ return chk('vista', v, vistas.indexOf(v.value) !== -1); }).join('') +
    '</div></div>' +
    '<div class="permisos-grupo"><span class="permisos-titulo">Acciones permitidas</span><div class="permisos-opciones">' +
      ACCIONES_PERMISO.map(function(a){ return chk('accion', a, acciones[a.value] === true); }).join('') +
    '</div></div>' +
    '<p class="hint">Ve solo las vistas marcadas, con las tareas de sus áreas y sin importes. Las acciones distintas de <b>Ver</b> quedan guardadas y la base ya las respeta; en el panel se irán habilitando a medida que se conecten.</p>' +
  '</div>';
}

function leerPermisos(clave){
  const caja = document.querySelector('[data-permisos="' + clave + '"]');
  const areas = [], vistas = [], acciones = {};
  caja.querySelectorAll('input[data-permiso="area"]').forEach(function(i){ if(i.checked) areas.push(i.value); });
  caja.querySelectorAll('input[data-permiso="vista"]').forEach(function(i){ if(i.checked) vistas.push(i.value); });
  caja.querySelectorAll('input[data-permiso="accion"]').forEach(function(i){ acciones[i.value] = i.checked; });
  return {areas: areas, vistas: vistas, acciones: acciones};
}

function permisosValidos(p){
  if(!p.areas.length) return 'Marcá al menos un área.';
  if(!p.acciones.ver) return 'Sin "Ver" la persona no puede consultar nada.';
  if(!p.vistas.length) return 'Marcá al menos una vista.';
  if(p.vistas.indexOf('desempeno') !== -1 && p.vistas.indexOf('carga') === -1) return 'Desempeño se abre desde Carga laboral: marcá también Carga laboral.';
  return '';
}

function permisosResumen(p){
  if(!p || !p.areas || !p.areas.length) return 'Sin permisos asignados';
  const areas = p.areas.map(function(a){ const x = AREAS_PERMISO.find(function(y){ return y.value === a; }); return x ? x.label : a; }).join(' + ');
  const acciones = ACCIONES_PERMISO.filter(function(a){ return p.acciones && p.acciones[a.value] === true; }).map(function(a){ return a.label; });
  const vistas = (Array.isArray(p.vistas) ? p.vistas : PERMISOS_INICIALES.vistas)
    .map(function(v){ const x = VISTAS_PERMISO.find(function(y){ return y.value === v; }); return x ? x.label : v; });
  return areas + ' · ' + vistas.join(', ') + ' · ' + (acciones.length ? acciones.join(', ') : 'sin acciones');
}

/* Usuario sugerido: primer nombre + primer apellido, sin tildes ni espacios
   ("Thalía Pérez Ruiz" → "thalia.perez"). Se puede cambiar a mano. */
function usuarioSugerido(nombre){
  const partes = String(nombre || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-zs]/g, '').trim().split(/s+/).filter(Boolean);
  return partes.slice(0, 2).join('.');
}

/* Igual que en login.html: Supabase Auth identifica por correo, así que el
   usuario que se elija acá se convierte en "usuario@friopacking.pe" para
   crear la cuenta. Ese correo no necesita existir. El usuario elegido se
   guarda además en la columna `usuario_login` de la tabla `usuario`, porque
   auth.users no se puede leer desde el navegador y si no no habría forma de
   mostrar con qué usuario entra cada persona. */
const DOMINIO_USUARIOS = 'friopacking.pe';

function correoDesdeUsuario(entrada){
  const v = String(entrada || '').trim().toLowerCase();
  return v.includes('@') ? v : v + '@' + DOMINIO_USUARIOS;
}

/* id de la cuenta del admin que usa esta vista: no puede eliminarse a sí mismo. */
let miUid = null;

/* Input de contraseña con el botón para verla. */
function passHtml(id){
  return '<span class="pass-wrap"><input type="password" id="' + id + '" minlength="6" required autocomplete="new-password">' +
    '<button type="button" class="pass-ojo" onclick="alternarVerPass(this)" aria-label="Mostrar contraseña" title="Mostrar contraseña">' +
      '<svg class="ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' +
      '<svg class="ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.4-1.6M3 3l18 18M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>' +
    '</button></span>';
}
function alternarVerPass(btn){
  const input = btn.parentNode.querySelector('input');
  const ver = input.type === 'password';
  input.type = ver ? 'text' : 'password';
  btn.classList.toggle('is-visible', ver);
  const txt = ver ? 'Ocultar contraseña' : 'Mostrar contraseña';
  btn.setAttribute('aria-label', txt); btn.title = txt;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderAccesoDenegado(){
  document.getElementById('contenido').innerHTML =
    '<div class="card access-denied">' +
      '<h2>No tenés acceso a esta vista</h2>' +
      '<p>Esta sección es solo para usuarios con rol <b>admin</b>. Si creés que deberías tener acceso, pedile a un administrador que te lo asigne.</p>' +
      '<p><a class="link-volver" href="index.html">← Volver al panel</a></p>' +
    '</div>';
}

async function cargarRoles(){
  const {data, error} = await db.from('roles').select('identificador, descripcion').order('descripcion');
  if(error){ console.error('No se pudieron cargar los roles:', error); return; }
  rolesDisponibles = data || [];
}

function opcionesRol(rolIdSeleccionado){
  return rolesDisponibles.map(function(r){
    return '<option value="' + r.identificador + '"' + (r.identificador === rolIdSeleccionado ? ' selected' : '') + '>' + escapeHtml(r.descripcion) + '</option>';
  }).join('');
}

async function cargarUsuarios(){
  /* Sin columna "user": la tabla `usuario` de la base no la tiene (ver el
     encabezado de supabase/12_roles_permisos.sql). Se muestra `activo`, que
     sí existe, para distinguir a alguien dado de baja. */
  let {data, error} = await db.from('usuario').select('identificador, nombre, usuario_login, rol_id, permisos, roles(descripcion)').order('nombre');
  if(error){
    const r = await db.from('usuario').select('identificador, nombre, usuario_login, rol_id, roles(descripcion)').order('nombre');
    if(!r.error){ hayColumnaPermisos = false; data = r.data; error = null; }
  }
  const tbody = document.getElementById('tabla-usuarios-body');
  if(error){
    tbody.innerHTML = '<tr><td colspan="5"><p class="msg error">No se pudo cargar la lista de usuarios: ' + escapeHtml(error.message) + '</p></td></tr>';
    return;
  }
  if(!data || !data.length){
    tbody.innerHTML = '<tr><td colspan="5"><p class="empty-state">Todavía no hay usuarios cargados.</p></td></tr>';
    return;
  }
  permisosPorUsuario = {};
  data.forEach(function(u){ permisosPorUsuario[u.identificador] = u.permisos || null; });
  tbody.innerHTML = data.map(function(u){
    /* El identificador es un uuid, no un número: va entre comillas dentro del
       onchange. Sin las comillas, 2cb308f1-6236-... se interpreta como una
       resta de identificadores y rompe el handler con un error de sintaxis. */
    const id = escapeHtml(u.identificador);
    return '<tr data-id="' + id + '">' +
      '<td>' + escapeHtml(u.nombre) + '</td>' +
      '<td>' + escapeHtml(u.usuario_login || '—') + '</td>' +
      '<td><select onchange="handleCambiarRol(&quot;' + id + '&quot;, this)">' + opcionesRol(u.rol_id) + '</select><span class="rol-status" id="rol-status-' + id + '"></span></td>' +
      '<td id="permisos-celda-' + id + '">' + permisosCeldaHtml(u.identificador, rolDescripcion(u.rol_id)) + '</td>' +
      '<td class="acciones-celda">' +
        '<button type="button" class="btn-mini" onclick="abrirCambioPass(&quot;' + id + '&quot;)">Contraseña</button>' +
        (u.identificador === miUid ? '' :
          '<button type="button" class="btn-mini peligro" onclick="eliminarUsuario(&quot;' + id + '&quot;, this)" data-nombre="' + escapeHtml(u.nombre) + '">Eliminar</button>') +
      '</td>' +
    '</tr>';
  }).join('');
}

function permisosCeldaHtml(id, rol){
  if(rol !== ROL_RESTRINGIDO) return '<span class="permisos-resumen">Según el rol</span>';
  if(!hayColumnaPermisos) return '<span class="permisos-resumen">Falta correr supabase/25</span>';
  return '<span class="permisos-resumen">' + escapeHtml(permisosResumen(permisosPorUsuario[id])) + '</span>' +
    '<button type="button" class="btn-mini" onclick="abrirEditorPermisos(&quot;' + escapeHtml(id) + '&quot;)">Editar</button>';
}

function abrirEditorPermisos(id){
  const previa = document.getElementById('fila-permisos-' + id);
  if(previa){ previa.remove(); return; }
  const fila = document.querySelector('tr[data-id="' + id + '"]');
  const tr = document.createElement('tr');
  tr.className = 'fila-permisos';
  tr.id = 'fila-permisos-' + id;
  tr.innerHTML = '<td colspan="5">' + permisosHtml(id, permisosPorUsuario[id]) +
    '<div class="form-actions"><button type="button" class="btn-submit" onclick="guardarPermisos(&quot;' + escapeHtml(id) + '&quot;, this)">Guardar permisos</button>' +
    '<span class="rol-status" id="permisos-status-' + escapeHtml(id) + '"></span></div></td>';
  fila.after(tr);
}

async function guardarPermisos(id, btn){
  const status = document.getElementById('permisos-status-' + id);
  const p = leerPermisos(id);
  const invalido = permisosValidos(p);
  if(invalido){ status.textContent = invalido; return; }
  btn.disabled = true; status.textContent = 'Guardando…';
  const {error} = await db.from('usuario').update({permisos: p}).eq('identificador', id);
  btn.disabled = false;
  if(error){ console.error('No se pudieron guardar los permisos:', error); status.textContent = 'Error al guardar'; return; }
  permisosPorUsuario[id] = p;
  document.getElementById('permisos-celda-' + id).innerHTML = permisosCeldaHtml(id, ROL_RESTRINGIDO);
  document.getElementById('fila-permisos-' + id).remove();
}

/* Cambio de contraseña: fila desplegable bajo el usuario. La contraseña actual
   no se puede mostrar (Supabase la guarda cifrada); solo se reemplaza. */
function abrirCambioPass(id){
  const previa = document.getElementById('fila-pass-' + id);
  if(previa){ previa.remove(); return; }
  const fila = document.querySelector('tr[data-id="' + id + '"]');
  const tr = document.createElement('tr');
  tr.className = 'fila-permisos';
  tr.id = 'fila-pass-' + id;
  tr.innerHTML = '<td colspan="5"><div class="permisos"><div class="fila-pass">' +
      '<label class="field"><span>Nueva contraseña</span>' + passHtml('pass-' + id) + '</label>' +
      '<button type="button" class="btn-submit" onclick="guardarContrasena(&quot;' + escapeHtml(id) + '&quot;, this)">Guardar contraseña</button>' +
      '<span class="rol-status" id="pass-status-' + escapeHtml(id) + '"></span>' +
    '</div><p class="hint">La contraseña actual no se puede ver: se guarda cifrada. Escribí la nueva y pasásela a la persona.</p></div></td>';
  fila.after(tr);
  document.getElementById('pass-' + id).focus();
}

async function guardarContrasena(id, btn){
  const input = document.getElementById('pass-' + id);
  const status = document.getElementById('pass-status-' + id);
  if(input.value.length < 6){ status.textContent = 'Mínimo 6 caracteres.'; return; }
  btn.disabled = true; status.textContent = 'Guardando…';
  const {error} = await db.rpc('admin_cambiar_contrasena', {p_uid: id, p_password: input.value});
  btn.disabled = false;
  if(error){
    console.error('No se pudo cambiar la contraseña:', error);
    status.textContent = /admin_cambiar_contrasena/.test(error.message || '') ? 'Falta correr supabase/27' : (error.message || 'Error al guardar');
    return;
  }
  status.textContent = 'Contraseña cambiada ✓';
  setTimeout(function(){ const f = document.getElementById('fila-pass-' + id); if(f) f.remove(); }, 1500);
}

async function eliminarUsuario(id, btn){
  const nombre = btn.dataset.nombre || 'este usuario';
  if(!confirm('¿Eliminar a ' + nombre + '? Se borra su cuenta y ya no podrá entrar. No se puede deshacer.')) return;
  btn.disabled = true; btn.textContent = 'Eliminando…';
  const {error} = await db.rpc('admin_eliminar_usuario', {p_uid: id});
  if(error){
    console.error('No se pudo eliminar el usuario:', error);
    alert(/admin_eliminar_usuario/.test(error.message || '') ? 'Falta correr supabase/27_admin_contrasena_eliminar.sql en Supabase.' : (error.message || 'No se pudo eliminar el usuario.'));
    btn.disabled = false; btn.textContent = 'Eliminar';
    return;
  }
  cargarUsuarios();
}

async function handleCambiarRol(id, select){
  const status = document.getElementById('rol-status-' + id);
  status.textContent = 'Guardando…';
  const {error} = await db.from('usuario').update({rol_id: Number(select.value)}).eq('identificador', id);
  status.textContent = error ? 'Error al guardar' : 'Guardado ✓';
  if(error) console.error('No se pudo cambiar el rol:', error);
  setTimeout(function(){ status.textContent = ''; }, 2500);
  if(error) return;
  /* Al pasar al perfil restringido se abren sus permisos para asignarlos:
     sin áreas, la persona entra y no ve nada. */
  const rol = rolDescripcion(select.value);
  document.getElementById('permisos-celda-' + id).innerHTML = permisosCeldaHtml(id, rol);
  const abierta = document.getElementById('fila-permisos-' + id);
  if(abierta) abierta.remove();
  if(rol === ROL_RESTRINGIDO && hayColumnaPermisos && !(permisosPorUsuario[id] && (permisosPorUsuario[id].areas || []).length)){
    abrirEditorPermisos(id);
  }
}

async function handleCrearUsuario(ev){
  ev.preventDefault();
  const nombre = document.getElementById('nuevo-nombre').value.trim();
  const usuarioLogin = document.getElementById('nuevo-usuario').value.trim().toLowerCase();
  const email = correoDesdeUsuario(usuarioLogin);
  const password = document.getElementById('nuevo-password').value;
  const rolId = Number(document.getElementById('nuevo-rol').value);
  const btn = document.getElementById('btn-crear-usuario');
  const msg = document.getElementById('crear-usuario-msg');
  msg.hidden = true;
  const restringido = rolDescripcion(rolId) === ROL_RESTRINGIDO;
  const permisos = restringido ? leerPermisos('nuevo') : null;
  const invalido = permisos ? permisosValidos(permisos) : '';
  if(invalido){
    msg.className = 'msg error'; msg.textContent = invalido; msg.hidden = false;
    return;
  }
  btn.disabled = true; btn.textContent = 'Creando…';

  try{
    /* Único mecanismo disponible sin backend propio para crear una cuenta de
       Supabase Auth es signUp con la clave anon. El problema: si el proyecto
       tiene "Confirm email" desactivado, signUp deja logueado automáticamente
       al usuario recién creado en ESTE cliente, pisando la sesión del admin
       que está usando este formulario. Por eso se guarda la sesión actual
       antes y se restaura después, pase lo que pase. */
    const {data:{session: sesionAdmin}} = await db.auth.getSession();

    const {data, error} = await db.auth.signUp({email, password});
    if(sesionAdmin){
      await db.auth.setSession({access_token: sesionAdmin.access_token, refresh_token: sesionAdmin.refresh_token});
    }
    if(error) throw error;
    if(!data.user){ throw new Error('Supabase no devolvió el usuario creado.'); }

    /* `identificador` es uuid, no tiene valor por defecto y además lleva una
       clave foránea contra auth.users(id): no se puede generar al azar, tiene
       que ser el id de la cuenta recién creada. `auth_user_id` apunta a lo
       mismo (es el vínculo que consulta el panel), así que se escribe el mismo
       valor en las dos para que no queden desfasadas. */
    const {error: errPerfil} = await db.from('usuario').insert({
      identificador: data.user.id,
      auth_user_id: data.user.id,
      usuario_login: usuarioLogin,
      nombre: nombre,
      rol_id: rolId,
      ...(permisos ? {permisos: permisos} : {}),
    });
    if(errPerfil) throw errPerfil;

    msg.className = 'msg ok';
    msg.textContent = 'Usuario creado. Si el proyecto tiene "Confirm email" activado en Supabase, la persona debe confirmar su correo antes de poder ingresar.';
    msg.hidden = false;
    document.getElementById('form-crear-usuario').reset();
    usuarioEditadoAMano = false;
    const ojo = document.querySelector('#form-crear-usuario .pass-ojo.is-visible');
    if(ojo) alternarVerPass(ojo);
    actualizarPermisosNuevo();
    cargarUsuarios();
  }catch(e){
    console.error('Error al crear usuario:', e);
    msg.className = 'msg error';
    msg.textContent = e.message || 'No se pudo crear el usuario.';
    msg.hidden = false;
  }finally{
    btn.disabled = false; btn.textContent = 'Crear usuario';
  }
}

function renderPanelAdmin(){
  document.getElementById('contenido').innerHTML =
    '<div class="card">' +
      '<h2>Crear usuario</h2>' +
      '<form id="form-crear-usuario">' +
        '<div class="form-grid">' +
          '<label class="field"><span>Nombre y apellido</span><input type="text" id="nuevo-nombre" placeholder="Ej.: Thalía Pérez" required></label>' +
          '<label class="field"><span>Usuario</span><input type="text" id="nuevo-usuario" autocapitalize="none" spellcheck="false" required></label>' +
          '<label class="field"><span>Contraseña</span>' + passHtml('nuevo-password') + '</label>' +
          '<label class="field"><span>Rol</span><select id="nuevo-rol" required>' + opcionesRol(null) + '</select></label>' +
        '</div>' +
        '<div id="nuevo-permisos" hidden>' + permisosHtml('nuevo', null) + '</div>' +
        '<div class="form-actions">' +
          '<button type="submit" class="btn-submit" id="btn-crear-usuario">Crear usuario</button>' +
        '</div>' +
        '<p class="msg" id="crear-usuario-msg" hidden></p>' +
        '<p class="hint">La persona entra con ese usuario y esa contraseña. No hace falta ningún correo: por detrás la cuenta se crea como <b>usuario@' + DOMINIO_USUARIOS + '</b>, que no necesita existir. Si alguien olvida su contraseña, se la cambiás desde Supabase (Authentication &rsaquo; Users), porque sin correo real no hay recuperación por mail.</p>' +
      '</form>' +
    '</div>' +
    '<div class="card">' +
      '<h2>Usuarios existentes</h2>' +
      '<table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Permisos</th><th>Acciones</th></tr></thead><tbody id="tabla-usuarios-body">' +
        '<tr><td colspan="5"><p class="empty-state">Cargando…</p></td></tr>' +
      '</tbody></table>' +
    '</div>';
  document.getElementById('form-crear-usuario').addEventListener('submit', handleCrearUsuario);
  /* El usuario se arma solo desde el nombre hasta que alguien lo edite. */
  document.getElementById('nuevo-nombre').addEventListener('input', function(){
    if(!usuarioEditadoAMano) document.getElementById('nuevo-usuario').value = usuarioSugerido(this.value);
  });
  document.getElementById('nuevo-usuario').addEventListener('input', function(){ usuarioEditadoAMano = !!this.value; });
  document.getElementById('nuevo-rol').addEventListener('change', actualizarPermisosNuevo);
  actualizarPermisosNuevo();
  cargarUsuarios();
}

let usuarioEditadoAMano = false;
/* Las casillas de permisos solo aparecen con el rol operativo_restringido. */
function actualizarPermisosNuevo(){
  const sel = document.getElementById('nuevo-rol');
  document.getElementById('nuevo-permisos').hidden = !sel || rolDescripcion(sel.value) !== ROL_RESTRINGIDO;
}

async function verificarAccesoYRenderizar(session){
  const {data, error} = await db.from('usuario').select('rol_id, roles(descripcion)').eq('auth_user_id', session.user.id).maybeSingle();
  if(error){ console.error('No se pudo verificar el rol:', error); renderAccesoDenegado(); return; }
  const rol = data && data.roles ? data.roles.descripcion : '';
  if(rol !== 'admin'){ renderAccesoDenegado(); return; }
  miUid = session.user.id;
  await cargarRoles();
  renderPanelAdmin();
}

document.getElementById('btn-logout').addEventListener('click', async function(){
  if(db) await db.auth.signOut();
});

window.addEventListener('DOMContentLoaded', function(){
  if(typeof supabase === 'undefined'){
    document.getElementById('contenido').innerHTML = '<div class="card"><p class="msg error">No se pudo conectar con el servidor. Revisá tu conexión a internet y recargá la página.</p></div>';
    return;
  }
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  db.auth.onAuthStateChange(function(event, session){
    if(session){
      verificarAccesoYRenderizar(session);
    }else{
      window.location.replace('login.html');
    }
  });
});
</script>
